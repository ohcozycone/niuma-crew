  <rect class="region" x="30" y="865" width="940" height="120" rx="12" stroke="#94a3b8"/>
  <path class="wire" d="M210 215V260H150V330"/>
  <path d="M852 330V260H790V215" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#return)"/>
  <path class="wire" d="M240 367H285"/>
  <path class="wire" d="M495 367H540"/>
