<rect class="phase" x="28" y="506" width="1384" height="34" rx="7"/>
<text class="section brand" x="44" y="530">02 观察与后台启动</text>
<text class="caption" x="1396" y="530" text-anchor="end">启动前复核授权；执行不等待页面订阅</text>
<path class="call" d="M120 568H360"/>
<text class="label" x="240.0" y="557" text-anchor="middle">SSE 订阅当前快照</text>
<rect class="frame" x="40" y="592" width="1360" height="972" rx="8"/>
<rect class="phase" x="40" y="592" width="66" height="30" rx="5"/>
<text class="english" x="73" y="614" text-anchor="middle">par</text>
<text class="caption" x="120" y="614">执行与接纳、SSE 观察并行；上下分支不表示先后</text>
<path class="call" d="M840 650H600"/>
<text class="label" x="720.0" y="639" text-anchor="middle">领取 Run → running</text>
<path class="call key" d="M840 688H1080"/>
<text class="label brand" x="960.0" y="677" text-anchor="middle">准备资源，启动 Agent</text>
<rect class="phase" x="56" y="714" width="1328" height="34" rx="7"/>
<text class="section brand" x="72" y="738">03 受控动作循环</text>
<text class="caption" x="1368" y="738" text-anchor="end">授权由执行侧判断，数据库保存动作事实</text>
<rect class="frame" x="522" y="762" width="854" height="330" rx="7"/>
<rect class="phase" x="522" y="762" width="66" height="28" rx="5"/>
<text class="english" x="555" y="783" text-anchor="middle">loop</text>
<text class="caption" x="602" y="783">模型 / 工具按需调用</text>
<text class="caption" x="1360" y="783" text-anchor="end">执行侧：事务内复核授权</text>
<path class="call" d="M1080 814H840"/>
<text class="label" x="960.0" y="803" text-anchor="middle">申请本次动作</text>
<path class="call" d="M840 850H600"/>
<text class="label" x="720.0" y="839" text-anchor="middle">预占预算并登记动作</text>
<path class="return key" d="M840 886H1080"/>
