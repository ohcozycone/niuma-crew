<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
<title id="title">员工目录、配置与展示：模块结构与协作</title>
<desc id="desc">箭头表示目录读取与编辑保存。完整表单和共享摘要不同，确认结果更新同一数据来源，不把卡片显示当作可保存配置。</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="#94a3b8"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif;fill:#e2e8f0}.muted{fill:#94a3b8}.label{fill:#cbd5e1}.title{font-weight:600}.edge{fill:none;stroke:#94a3b8;stroke-width:1.7;marker-end:url(#arrow)}</style>
<rect width="1280" height="920" fill="#0f172a"/><rect width="1280" height="920" fill="url(#grid)"/>
<path class="edge" d="M360 265H480"/>
<path class="edge" d="M800 265H920"/>
<path class="edge" d="M1080 350V385H200V560"/>
<path class="edge" d="M360 645H480"/>
<path class="edge" d="M800 645H920"/>
