<text x="200" y="249" text-anchor="middle" font-size="15" class="muted">AgentsPage / useAgentDirectory</text>
<text x="200" y="278" text-anchor="middle" font-size="15" class="">搜索、筛选与分页</text>
<rect x="480" y="180" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="480" y="180" width="320" height="170" rx="10" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.6"/>
<text x="640" y="215" text-anchor="middle" font-size="21" class="title">共享员工数据</text>
<text x="640" y="249" text-anchor="middle" font-size="15" class="muted">AgentStore / WorkspaceData</text>
<text x="640" y="278" text-anchor="middle" font-size="15" class="">摘要按 ID，查询保存顺序</text>
<rect x="920" y="180" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="920" y="180" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="1080" y="215" text-anchor="middle" font-size="21" class="title">目录及侧栏卡片</text>
<text x="1080" y="249" text-anchor="middle" font-size="15" class="muted">AgentDirectory / AgentCard</text>
<text x="1080" y="278" text-anchor="middle" font-size="15" class="">只订阅自身员工记录</text>
<rect x="40" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="40" y="560" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="200" y="595" text-anchor="middle" font-size="21" class="title">完整编辑与装配</text>
<text x="200" y="629" text-anchor="middle" font-size="15" class="muted">useAgentEditor / </text>
<text x="200" y="652" text-anchor="middle" font-size="15" class="muted">AgentConfiguration</text>
<text x="200" y="681" text-anchor="middle" font-size="15" class="">主表单草稿、资源选择和修订</text>
<rect x="480" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="480" y="560" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="640" y="595" text-anchor="middle" font-size="21" class="title">保存与业务确认</text>
<text x="640" y="629" text-anchor="middle" font-size="15" class="muted">lib/api/agents → 后端 agents</text>
<text x="640" y="658" text-anchor="middle" font-size="15" class="">共同保存完整岗位及装配</text>
<rect x="920" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
