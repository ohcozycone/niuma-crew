<title id="title">后端分层｜业务协作、数据所有者与运行支撑</title>
<desc id="desc">请求 service 可在 API；共享流程归业务模块；execution 只接受注入的运行协作能力。 实线表示已有职责，虚线表示后续未实现能力；当前范围已实施。</desc>
