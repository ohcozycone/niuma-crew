<text x="48" y="101" class="title" text-anchor="start">后端现状｜业务操作、可靠执行与 Agent 循环</text>
<text x="48" y="144" class="sub" text-anchor="start">同一后端进程、同一业务数据库；箭头表示主要调用，省略查询、返回与部分共用事务连线。</text>
<text x="1552" y="56" class="code" text-anchor="end">CURRENT · 2026-10-30</text>
<g data-component="card"><rect x="48" y="200" width="1504" height="90" rx="10" fill="#18283e" stroke="#a2b1c8"/>
<text x="66" y="234" class="name" text-anchor="start" style="fill:#a2b1c8">应用装配 · bootstrap</text>
<text x="66" y="265" class="small" text-anchor="start">lifespan 装配业务服务、ConversationService、发布与授权回调、checkpoint 和单个 Runner。</text>
</g>
<g data-component="card"><rect x="48" y="335" width="1504" height="92" rx="10" fill="#18283e" stroke="#69c7dc"/>
<text x="66" y="369" class="name" text-anchor="start" style="fill:#69c7dc">HTTP 入口 · api/routes</text>
<text x="66" y="400" class="small" text-anchor="start">配置管理 · 对话与消息 · 提交 / 取消 / 重试 · 历史、实际动作与只读 SSE</text>
</g>
<g data-component="card"><rect x="48" y="505" width="460" height="151" rx="10" fill="#18283e" stroke="#78c8b0"/>
<text x="66" y="539" class="name" text-anchor="start" style="fill:#78c8b0">员工配置与执行依据</text>
<text x="66" y="570" class="small" text-anchor="start">agents / skills / model_connections</text>
<text x="66" y="596" class="small" text-anchor="start">规则、装配和修订由所属模块维护</text>
<text x="66" y="622" class="small" text-anchor="start">受信配置读取复用调用方 Session</text>
</g>
<g data-component="card"><rect x="570" y="505" width="460" height="151" rx="10" fill="#18283e" stroke="#c0a6e7"/>
<text x="588" y="539" class="name" text-anchor="start" style="fill:#c0a6e7">对话操作 · conversations</text>
<text x="588" y="570" class="small" text-anchor="start">ConversationService / PublishRun</text>
<text x="588" y="596" class="small" text-anchor="start">接受：消息 + Run + 关联同事务</text>
<text x="588" y="622" class="small" text-anchor="start">发布：正文、文件关联及终态同事务</text>
</g>
<g data-component="card"><rect x="1092" y="505" width="460" height="151" rx="10" fill="#18283e" stroke="#78c8b0"/>
<text x="1110" y="539" class="name" text-anchor="start" style="fill:#78c8b0">身份与访问控制 · auth</text>
<text x="1110" y="570" class="small" text-anchor="start">service：身份及登录会话有效性</text>
<text x="1110" y="596" class="small" text-anchor="start">permissions：操作与资源范围</text>
<text x="1110" y="622" class="small" text-anchor="start">业务入口、动作和发布前执行检查</text>
</g>
<g data-component="card"><rect x="48" y="775" width="460" height="151" rx="10" fill="#18283e" stroke="#69c7dc"/>
<text x="66" y="809" class="name" text-anchor="start" style="fill:#69c7dc">内容与查询 · conversations</text>
<text x="66" y="840" class="small" text-anchor="start">Conversation / Message / ConversationRun</text>
<text x="66" y="866" class="small" text-anchor="start">保存原文、最终正文和运行关联</text>
<text x="66" y="892" class="small" text-anchor="start">历史、快照与 SSE 读取已提交内容</text>
</g>
<g data-component="card"><rect x="570" y="775" width="460" height="151" rx="10" fill="#18283e" stroke="#e7bd77"/>
<text x="588" y="809" class="name" text-anchor="start" style="fill:#e7bd77">可靠执行 · execution</text>
<text x="588" y="840" class="small" text-anchor="start">Run / RunAction / RunControl</text>
<text x="588" y="866" class="small" text-anchor="start">排队、容量、预算、取消与恢复</text>
<text x="588" y="892" class="small" text-anchor="start">coordinator 调用准备与发布回调</text>
</g>
<g data-component="card"><rect x="1092" y="775" width="460" height="151" rx="10" fill="#18283e" stroke="#e7bd77"/>
<text x="1110" y="809" class="name" text-anchor="start" style="fill:#e7bd77">Agent 循环 · agent_runtime</text>
<text x="1110" y="840" class="small" text-anchor="start">组织模型、技能加载和已许可工具</text>
<text x="1110" y="866" class="small" text-anchor="start">SDK 消息与产品 Message 分开</text>
<text x="1110" y="892" class="small" text-anchor="start">通过 RuntimeControl 记动作和用量</text>
</g>
<g data-component="card"><rect x="48" y="1030" width="460" height="105" rx="10" fill="#18283e" stroke="#8bacdf"/>
<text x="66" y="1064" class="name" text-anchor="start" style="fill:#8bacdf">业务数据库 · infrastructure</text>
<text x="66" y="1095" class="small" text-anchor="start">配置 / Message / Run / RunAction</text>
<text x="66" y="1121" class="small" text-anchor="start">共用业务库，通过短事务提交</text>
</g>
<g data-component="card"><rect x="570" y="1030" width="460" height="105" rx="10" fill="#18283e" stroke="#8bacdf"/>
<text x="588" y="1064" class="name" text-anchor="start" style="fill:#8bacdf">模型协议 · llm</text>
<text x="588" y="1095" class="small" text-anchor="start">连接模型、接收响应和用量</text>
<text x="588" y="1121" class="small" text-anchor="start">显式配置与受控网络</text>
</g>
<g data-component="card"><rect x="1092" y="1030" width="460" height="105" rx="10" fill="#18283e" stroke="#a2b1c8"/>
<text x="1110" y="1064" class="name" text-anchor="start" style="fill:#a2b1c8">工具、文件与 SDK 恢复</text>
<text x="1110" y="1095" class="small" text-anchor="start">tools / files / sandboxes 提供资源</text>
<text x="1110" y="1121" class="small" text-anchor="start">agent_runtime 管理每轮 checkpoint</text>
</g>
<text x="827" y="477" class="small" text-anchor="start">调用</text>
<text x="330" y="696" class="small" text-anchor="start">业务消息与关联</text>
<text x="886" y="738" class="small" text-anchor="start">执行准入</text>
<text x="636" y="747" class="small" text-anchor="start">结果发布</text>
<text x="1044" y="832" class="small" text-anchor="start">执行</text>
<text x="1044" y="886" class="small" text-anchor="start">记账</text>
<text x="862" y="968" class="small" text-anchor="start">调用模型</text>
<text x="1427" y="992" class="small" text-anchor="start">按许可使用</text>
<text x="167" y="1003" class="small" text-anchor="start">短事务</text>
<text x="48" y="1186" class="small" text-anchor="start">稳定产品内容由业务库保存；SDK checkpoint 只用于内部执行与恢复，损坏不阻止已发布历史读取。</text>
<text x="48" y="1215" class="small" text-anchor="start">execution 使用注入的准备、复核和发布回调；Agent 循环不取得业务 Session 或 RunStore。</text>
<text x="1552" y="1275" class="code" text-anchor="end">NIUMACREW / BACKEND / 2026-10-30</text>
</svg>