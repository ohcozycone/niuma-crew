<text x="640.0" y="373" text-anchor="middle" font-size="14" class="label">提供模型对象</text>
<rect x="378.0" y="613" width="84" height="24" rx="3" fill="#0f172a"/>
<text x="420.0" y="630" text-anchor="middle" font-size="14" class="label">响应和异常</text>
<rect x="811.0" y="613" width="98" height="24" rx="3" fill="#0f172a"/>
<text x="860.0" y="630" text-anchor="middle" font-size="14" class="label">普通结果数据</text>
<text x="40" y="52" text-anchor="start" font-size="26" class="title">模型客户端与供应商适配：内部结构与协作</text>
<text x="40" y="88" font-size="16" class="muted">节点对应实际实现；箭头标明调用或数据交付，具体事务和授权边界见正文。</text>
<text x="40" y="875" font-size="15" class="muted">当前实现的模块协作图；目录结构和图中职责不表示已经独立部署为多个服务。</text>
