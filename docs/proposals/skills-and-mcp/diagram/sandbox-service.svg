<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1045" role="img" aria-labelledby="title desc">
  <title id="title">独立沙箱服务与容量调度：拟议架构</title>
  <desc id="desc">Agent 平台通过独立沙箱服务申请任务环境。服务拥有持久队列、容量调度和资源状态，使用官方 SDK 调用 OpenSandbox。最多三个环境为示例；Mac 和 Linux 共享接口，采用不同部署运行时。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5 0 7Z" fill="#94a3b8"/></marker>
    <marker id="return" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5 0 7" fill="none" stroke="#22d3ee" stroke-width="1.5"/></marker>
    <style>
      text { font-family: 'SF Mono', 'JetBrains Mono', 'PingFang SC', 'Noto Sans SC', sans-serif; fill:#e2e8f0; }
      .name { font-size:15px; font-weight:600; text-anchor:middle; }
      .sub { font-size:11px; fill:#94a3b8; text-anchor:middle; }
      .label { font-size:11px; fill:#94a3b8; }
      .region { fill:none; stroke-width:1; stroke-dasharray:8 4; }
      .wire { fill:none; stroke:#94a3b8; stroke-width:1.5; marker-end:url(#arrow); }
      .mask { fill:#0f172a; }
    </style>
  </defs>
