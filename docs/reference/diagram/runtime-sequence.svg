<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
<title id="title">当前执行时序：原子接受、后台执行与原子发布</title>
<desc id="desc">SDK 按 Run 隔离，业务数据库保存稳定消息和结果；观察连接只读取已提交状态。</desc>
<defs>
