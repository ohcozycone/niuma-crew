<text x="40" y="62" font-size="35" font-weight="700" fill="#eaf1fa" text-anchor="start">执行边界｜宿主管运行，Agent 管内部模型与工具循环</text>
<text x="40" y="103" font-size="19" font-weight="400" fill="#b6c6da" text-anchor="start">execution 是模块；Run 是模块内的执行记录。Agent 不通过共享对象取得整个数据库或执行存储。</text>
<text x="1760" y="140" font-size="16" font-weight="400" fill="#a2b4cd" text-anchor="end">04 / 04  ·  当前实施 / 职责边界  ·  2026-10-27</text>
<text x="64" y="204" font-size="24" font-weight="650" fill="#b99bfa" text-anchor="start">API 请求服务与对话共享流程｜各自归属，明确调用</text>
<text x="64" y="234" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">接受归 API 请求服务；准备、授权和发布归 conversations；Agent 返回候选，宿主调用共享发布。</text>
<text x="82" y="284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">接受操作</text>
<text x="82" y="313" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">api/routes/conversations/service</text>
<text x="82" y="336" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">接受后由执行宿主独立调度</text>
<text x="648" y="284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">组合运行许可</text>
<text x="648" y="313" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">conversations/authorization</text>
<text x="648" y="336" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">身份、装配与能力由所属模块检查</text>
<text x="1214" y="284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">发布操作</text>
<text x="1214" y="313" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">conversations/publication</text>
<text x="1214" y="336" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">内容、专业报告与执行终态一起提交</text>
<text x="64" y="464" font-size="24" font-weight="650" fill="#63d5b2" text-anchor="start">执行宿主 · execution</text>
<text x="64" y="494" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">管理一次处理的可靠运行；不实现模型与工具的决策循环。</text>
<text x="82" y="550" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">执行记录</text>
<text x="82" y="573" font-size="15" font-weight="400" fill="#63d5b2" text-anchor="start">记录 / 本地状态规则</text>
<text x="82" y="598" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">Run：ID、输入依据和状态</text>
<text x="82" y="625" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">动作与运行状态归本模块</text>
<text x="82" y="652" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">正文和专业报告由业务保存</text>
<text x="433" y="550" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">多次处理的调度</text>
<text x="433" y="573" font-size="15" font-weight="400" fill="#63d5b2" text-anchor="start">scheduler（职责名）</text>
<text x="433" y="598" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">扫描已接受的排队记录</text>
<text x="433" y="625" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">并发、进程锁和任务看护</text>
<text x="433" y="652" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">不替模型决定调用什么工具</text>
<text x="82" y="788" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">单次处理控制</text>
<text x="82" y="811" font-size="15" font-weight="400" fill="#63d5b2" text-anchor="start">coordinator</text>
<text x="82" y="836" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">启动具体执行实现</text>
<text x="82" y="863" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">总时限、取消和故障收束</text>
<text x="82" y="890" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">调用注入的对话发布入口</text>
<text x="433" y="788" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">过程与预算存取</text>
<text x="433" y="811" font-size="15" font-weight="400" fill="#63d5b2" text-anchor="start">store / control</text>
<text x="433" y="836" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">记录实际动作、用量与进度</text>
<text x="433" y="863" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">持久预算跨恢复继续生效</text>
<text x="433" y="890" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">不解析 SDK 的 Message 类型</text>
<text x="82" y="1026" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">受限宿主接口</text>
<text x="82" y="1049" font-size="15" font-weight="400" fill="#63d5b2" text-anchor="start">RuntimeControl / control</text>
<text x="82" y="1074" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">检查是否允许继续</text>
<text x="82" y="1101" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">确认动作、接收普通内容更新</text>
<text x="82" y="1128" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">不公开存储、数据库与身份服务</text>
<text x="433" y="1026" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">恢复管理</text>
<text x="433" y="1049" font-size="15" font-weight="400" fill="#63d5b2" text-anchor="start">恢复引用 / 版本 / 预算</text>
<text x="433" y="1074" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">判断这次处理是否允许恢复</text>
<text x="433" y="1101" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">保存恢复位置与兼容标识</text>
<text x="433" y="1128" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">不解释具体 SDK 图节点</text>
<text x="64" y="1250" font-size="18" font-weight="400" fill="#9fdcc8" text-anchor="start">不负责：聊天内容规则、员工装配规则、专业报告解释。</text>
<text x="64" y="1290" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">SDK 解析、业务规则与执行控制各自维护，通过受限接口协作。</text>
<text x="1024" y="464" font-size="24" font-weight="650" fill="#48c7ed" text-anchor="start">Agent 内部运行 · agent_runtime</text>
<text x="1024" y="494" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">已从执行宿主拆出；内部使用 LangChain，宿主不解析 SDK 消息。</text>
<text x="1042" y="550" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">执行实现</text>
<text x="1042" y="573" font-size="15" font-weight="400" fill="#48c7ed" text-anchor="start">langchain.py / 启动</text>
<text x="1042" y="598" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">接收本次冻结输入和能力</text>
<text x="1042" y="625" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">不自行查询用户或员工配置</text>
<text x="1042" y="652" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">不创建应用的执行记录</text>
<text x="1409" y="550" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">模型与工具循环</text>
<text x="1409" y="573" font-size="15" font-weight="400" fill="#48c7ed" text-anchor="start">langchain.py / 循环</text>
<text x="1409" y="598" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">调用模型、解释工具请求</text>
<text x="1409" y="625" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">读取获准工具返回后继续</text>
<text x="1409" y="652" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">决定内部循环何时结束</text>
<text x="1042" y="788" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">SDK 内容转换</text>
<text x="1042" y="811" font-size="15" font-weight="400" fill="#48c7ed" text-anchor="start">streaming</text>
<text x="1042" y="836" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">区分模型文本和工具返回</text>
<text x="1042" y="863" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">转换成普通内容更新</text>
<text x="1042" y="890" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">不把每条 SDK message 当聊天</text>
<text x="1409" y="788" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">本轮方法与工具</text>
<text x="1409" y="811" font-size="15" font-weight="400" fill="#48c7ed" text-anchor="start">skill_loading / middleware</text>
<text x="1409" y="836" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">装载本轮已获准资源</text>
<text x="1409" y="863" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">通过宿主接口申请动作</text>
<text x="1409" y="890" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">不扩展自身权限和预算</text>
<text x="1042" y="1026" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">SDK 恢复解释</text>
<text x="1042" y="1049" font-size="15" font-weight="400" fill="#48c7ed" text-anchor="start">checkpoints</text>
<text x="1042" y="1074" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">解释具体 SDK 存档格式</text>
<text x="1042" y="1101" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">通过专用恢复端口读写</text>
<text x="1042" y="1128" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">不读取业务 Message 表</text>
<text x="1409" y="1026" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">完成与产出</text>
<text x="1409" y="1049" font-size="15" font-weight="400" fill="#48c7ed" text-anchor="start">运行返回值 / 失败类型</text>
<text x="1409" y="1074" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">确认完整输出或明确失败</text>
<text x="1409" y="1101" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">返回文字、结构化结果与用量</text>
<text x="1409" y="1128" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">不提交业务终态或发布消息</text>
<text x="1024" y="1250" font-size="18" font-weight="400" fill="#a8dcf0" text-anchor="start">不持有：HTTP Request、Actor、业务 ORM、完整执行 Store。</text>
<text x="1024" y="1290" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">SDK 类型停留在适配器；进度与结束信号使用普通数据。</text>
<text x="424" y="411" font-size="17" font-weight="400" fill="#c6b3ef" text-anchor="start">接受后独立运行</text>
<text x="880" y="599" font-size="19" font-weight="400" fill="#a8dcf0" text-anchor="middle">执行请求</text>
<text x="880" y="652" font-size="15" font-weight="400" fill="#aebfd4" text-anchor="middle">冻结输入 + 受限能力</text>
<text x="880" y="839" font-size="19" font-weight="400" fill="#9fdcc8" text-anchor="middle">许可与过程更新</text>
<text x="880" y="892" font-size="15" font-weight="400" fill="#aebfd4" text-anchor="middle">确认后才发起动作</text>
<text x="880" y="1079" font-size="19" font-weight="400" fill="#c6b3ef" text-anchor="middle">产出或失败</text>
<text x="880" y="1132" font-size="15" font-weight="400" fill="#aebfd4" text-anchor="middle">调用注入的对话 publication</text>
<text x="64" y="1424" font-size="24" font-weight="650" fill="#a2b4cd" text-anchor="start">由受限接口接入的能力｜不是运行时可以任意访问的共享对象</text>
<text x="64" y="1454" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">下面是依赖和适配方向，不表示四项都由同一个模块拥有。</text>
<text x="82" y="1504" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">身份与配置规则</text>
<text x="82" y="1533" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">auth / agents / model_connections</text>
<text x="82" y="1556" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">由应用授权逻辑组合</text>
<text x="508" y="1504" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">模型与外部协议</text>
<text x="508" y="1533" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">llm、当前工具适配</text>
<text x="508" y="1556" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">调用在业务事务外进行</text>
<text x="934" y="1504" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">业务执行存储</text>
<text x="934" y="1533" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">由 execution 管理写入</text>
<text x="934" y="1556" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">运行时只报告受限过程数据</text>
<text x="1360" y="1504" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">SDK 恢复存储</text>
<text x="1360" y="1533" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">专用恢复端口与格式适配</text>
<text x="1360" y="1556" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">已发布历史不依赖 SDK 存档</text>
<text x="40" y="1667" font-size="17" font-weight="400" fill="#b6c6da" text-anchor="start">请求服务接受操作；对话共享流程准备授权发布；execution 管运行，agent_runtime 管内部循环。</text>
<text x="40" y="1697" font-size="17" font-weight="400" fill="#a2b4cd" text-anchor="start">实体不构成调用层：Message 属于对话，Run 属于执行；受限控制与 SDK 目录已独立。</text>
<text x="1760" y="1728" font-size="13" font-weight="400" fill="#7b91ad" text-anchor="end">NIUMACREW · LAYERED ARCHITECTURE</text>
</svg>
