<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1828" role="img" aria-labelledby="title desc">
<title id="title">对话处理流程</title>
<desc id="desc">当前实现的一次新对话完整主线。六条泳道表示客户端、对话服务、业务数据库、受控执行、Agent运行时、模型与工具。HTTP与SSE适配折叠到请求线上。受理事务仅共同提交消息、Run、文件关联与业务关联，文件字节独立保存。执行侧在动作短事务内复核授权，预占预算并记录动作，成功后向Agent返回许可，再调用模型或工具。并行框完整包含后台执行及业务接纳，与持续至Run终态且接纳不再等待的SSE观察循环。成果与终态先落库，完成提示仅唤醒扫描，对话服务另行读取成果、复核接纳资格并保存正式回复。检查点独立持久化，底部说明关键分支。</desc>
<metadata>配色来源：frontend/src/design-system/theme.css。泳道按职责合并，不表示独立进程。</metadata>
<defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" class="arrow"/></marker>
<marker id="key-arrow" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" class="key-arrow"/></marker>
<style>
text{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
.title{font-size:30px;font-weight:600;letter-spacing:-.4px}
.name{font-size:22px;font-weight:600}
.section{font-size:20px;font-weight:600}
.label{font-size:20px}
.caption{font-size:18px}
.english{font-size:16px}
.branch{font-size:17px}
.card,.note,.phase,.frame,.activation{stroke-width:1.2}
.frame{fill:none}
.lifeline{stroke-width:1.2;stroke-dasharray:4 7}
.call,.return{fill:none;stroke-width:1.5;stroke-linecap:butt;marker-end:url(#arrow)}
.return{stroke-dasharray:6 4}
.key{marker-end:url(#key-arrow)}
.divider{stroke-width:1.2;stroke-dasharray:5 5}

.canvas{fill:#1b1a18}
text{fill:#f2eee5}
.caption,.english{fill:#b9b4a8}
.brand{fill:#eea379}
.card{fill:#2a2824;stroke:#464239}
.phase,.note{fill:#242321;stroke:#464239}
.frame{stroke:#b9b4a8;stroke-opacity:.4}
.lifeline,.divider{stroke:#b9b4a8;stroke-opacity:.35}
.activation{fill:#302d28;stroke:#464239}
.call,.return{stroke:#b9b4a8}
.arrow{fill:#b9b4a8}
.key{stroke:#eea379}
.key-arrow{fill:#eea379}

</style></defs>
