<text x="200" y="249" text-anchor="middle" font-size="15" class="muted">LLMConfig</text>
<text x="200" y="278" text-anchor="middle" font-size="15" class="">模型 / 地址 / 秘密 / 时限</text>
<rect x="480" y="180" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="480" y="180" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="640" y="215" text-anchor="middle" font-size="21" class="title">执行级连接管理</text>
<text x="640" y="249" text-anchor="middle" font-size="15" class="muted">factory.model_session</text>
<text x="640" y="278" text-anchor="middle" font-size="15" class="">创建受管异步 HTTP 客户端</text>
<rect x="920" y="180" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="920" y="180" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="1080" y="215" text-anchor="middle" font-size="21" class="title">兼容聊天模型</text>
<text x="1080" y="249" text-anchor="middle" font-size="15" class="muted">create_chat_model / ChatOpenAI</text>
<text x="1080" y="278" text-anchor="middle" font-size="15" class="">Chat Completions，显式重试配置</text>
<rect x="40" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="40" y="560" width="320" height="170" rx="10" fill="#fb923c" fill-opacity="0.08" stroke="#fb923c" stroke-width="1.6"/>
