<text x="200" y="278" text-anchor="middle" font-size="15" class="">明确用户、用途及来源运行</text>
<rect x="480" y="180" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="480" y="180" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="640" y="215" text-anchor="middle" font-size="21" class="title">可靠字节写入</text>
<text x="640" y="249" text-anchor="middle" font-size="15" class="muted">service.save</text>
<text x="640" y="278" text-anchor="middle" font-size="15" class="">限额、临时文件、刷盘与改名</text>
<rect x="920" y="180" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="920" y="180" width="320" height="170" rx="10" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.6"/>
