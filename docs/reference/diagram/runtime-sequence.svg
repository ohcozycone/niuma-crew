<g text-anchor="middle" class="name"><text x="140" y="208">客户端</text><text x="450" y="208">应用用例</text><text x="780" y="208">业务数据库</text><text x="1100" y="208">execution</text><text x="1430" y="208">SDK / 恢复库</text></g>
