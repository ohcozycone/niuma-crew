<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1800" role="img" aria-labelledby="title desc"><title id="title">建议的职责关系｜共同执行机制，专业规则提供确定输入</title><desc id="desc">这是待实施示例。保留模块化单体、共享数据库和两个业务事务，不增加微服务或消息总线。</desc><defs><marker id="a60a5fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#60a5fa"/></marker><marker id="a22d3ee" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#22d3ee"/></marker><marker id="a34d399" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#34d399"/></marker><marker id="aa78bfa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#a78bfa"/></marker><marker id="afbbf24" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#fbbf24"/></marker><marker id="afb7185" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#fb7185"/></marker><marker id="a94a3b8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#94a3b8"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;}</style><rect width="100%" height="100%" fill="#0f172a"/><path d="M 800,265 L 800,355" fill="none" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#a22d3ee)"/><path d="M 70,465 L 35,465 L 35,990 L 70,990" fill="none" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#a22d3ee)"/><path d="M 280,505 L 280,650" fill="none" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#aa78bfa)"/><path d="M 800,505 L 800,650" fill="none" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#aa78bfa)"/><path d="M 1320,505 L 1320,650" fill="none" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#aa78bfa)"/><path d="M 490,465 L 535,465 L 535,1010 L 590,1010" fill="none" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#aa78bfa)"/><path d="M 1010,1010 L 1060,1010 L 1060,465 L 1110,465" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#afbbf24)"/><path d="M 800,1105 L 800,1195" fill="none" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#afbbf24)"/><path d="M 590,1245 L 280,1245 L 280,1370" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a60a5fa)"/><path d="M 1010,1245 L 1320,1245 L 1320,1370" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a60a5fa)"/><path d="M 800,1295 L 800,1450" fill="none" stroke="#34d399" stroke-width="2.2" marker-end="url(#a34d399)"/><path d="M 280,1520 L 280,1600" fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#a60a5fa)"/><path d="M 1320,1520 L 1320,1600" fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#a60a5fa)"/><rect x="70" y="170" width="1460" height="95" rx="12" fill="#0f172a"/><rect x="70" y="170" width="1460" height="95" rx="12" fill="#22d3ee" fill-opacity=".09" stroke="#22d3ee" stroke-width="1.6"/><rect x="70" y="355" width="1460" height="150" rx="12" fill="#0f172a"/><rect x="70" y="355" width="1460" height="150" rx="12" fill="#a78bfa" fill-opacity=".09" stroke="#a78bfa" stroke-width="1.6"/><rect x="70" y="650" width="420" height="150" rx="12" fill="#0f172a"/><rect x="70" y="650" width="420" height="150" rx="12" fill="#22d3ee" fill-opacity=".09" stroke="#22d3ee" stroke-width="1.6"/><rect x="590" y="650" width="420" height="150" rx="12" fill="#0f172a"/><rect x="590" y="650" width="420" height="150" rx="12" fill="#34d399" fill-opacity=".09" stroke="#34d399" stroke-width="1.6"/><rect x="1110" y="650" width="420" height="150" rx="12" fill="#0f172a"/><rect x="1110" y="650" width="420" height="150" rx="12" fill="#fb7185" fill-opacity=".09" stroke="#fb7185" stroke-width="1.6"/><rect x="70" y="935" width="420" height="110" rx="12" fill="#0f172a"/><rect x="70" y="935" width="420" height="110" rx="12" fill="#22d3ee" fill-opacity=".09" stroke="#22d3ee" stroke-width="1.6"/><rect x="590" y="935" width="420" height="170" rx="12" fill="#0f172a"/><rect x="590" y="935" width="420" height="170" rx="12" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24" stroke-width="1.6"/><rect x="590" y="1195" width="420" height="100" rx="12" fill="#0f172a"/><rect x="590" y="1195" width="420" height="100" rx="12" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24" stroke-width="1.6"/><rect x="70" y="1370" width="420" height="150" rx="12" fill="#0f172a"/><rect x="70" y="1370" width="420" height="150" rx="12" fill="#60a5fa" fill-opacity=".09" stroke="#60a5fa" stroke-width="1.6"/><rect x="1110" y="1370" width="420" height="150" rx="12" fill="#0f172a"/><rect x="1110" y="1370" width="420" height="150" rx="12" fill="#60a5fa" fill-opacity=".09" stroke="#60a5fa" stroke-width="1.6"/><rect x="70" y="1600" width="420" height="90" rx="12" fill="#0f172a"/><rect x="70" y="1600" width="420" height="90" rx="12" fill="#60a5fa" fill-opacity=".09" stroke="#60a5fa" stroke-width="1.6"/><rect x="590" y="1450" width="420" height="110" rx="12" fill="#0f172a"/><rect x="590" y="1450" width="420" height="110" rx="12" fill="#34d399" fill-opacity=".09" stroke="#34d399" stroke-width="1.6"/><rect x="1110" y="1600" width="420" height="90" rx="12" fill="#0f172a"/><rect x="1110" y="1600" width="420" height="90" rx="12" fill="#60a5fa" fill-opacity=".09" stroke="#60a5fa" stroke-width="1.6"/><text x="90" y="206" font-size="25" fill="#22d3ee" text-anchor="start" font-weight="650">api · HTTP 入口与只读观察</text><text x="90" y="240" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">身份解析 / 请求 DTO / 响应 / SSE；将业务命令交给应用用例。</text><text x="90" y="391" font-size="25" fill="#a78bfa" text-anchor="start" font-weight="650">use_cases · 跨模块流程与运行政策</text><text x="90" y="425" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">提交 / 准备 RunSpec / 授权组合 / 专业策略选择 / 原子发布</text><text x="90" y="454" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">在接受与发布时组织共用事务；bootstrap 只负责装配这些实现。</text><text x="90" y="686" font-size="25" fill="#22d3ee" text-anchor="start" font-weight="650">conversations</text><text x="90" y="720" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">消息 / 顺序 / 上下文 / 结果引用</text><text x="90" y="749" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">不直接读取 snapshot.ci 决定规则。</text><text x="610" y="686" font-size="25" fill="#34d399" text-anchor="start" font-weight="650">配置资产视图</text><text x="610" y="720" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">agents / skills / 模型连接 / 规则</text><text x="610" y="749" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">提供各自的配置与当前许可。</text><text x="1130" y="686" font-size="25" fill="#fb7185" text-anchor="start" font-weight="650">CI 专业规则</text><text x="1130" y="720" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">目标范围 / 方法 / 证据校验</text><text x="1130" y="749" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">提供专业策略与限制，不自建通用循环。</text><text x="90" y="971" font-size="25" fill="#22d3ee" text-anchor="start" font-weight="650">auth · 身份与基础权限</text><text x="90" y="1005" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">运行许可再与资产及专业范围组合。</text><text x="610" y="971" font-size="25" fill="#fbbf24" text-anchor="start" font-weight="650">execution · 共同生命周期</text><text x="610" y="1005" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">准入 / 状态转换 / 取消 / 动作</text><text x="610" y="1034" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">统一记账 / 预算机制 / 稳定结果</text><text x="610" y="1063" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">恢复按执行策略需要启用。</text><text x="610" y="1231" font-size="25" fill="#fbbf24" text-anchor="start" font-weight="650">小而明确的执行契约</text><text x="610" y="1265" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">模型 / 动作 / 恢复 / 发布接口</text><text x="90" y="1406" font-size="25" fill="#60a5fa" text-anchor="start" font-weight="650">框架适配</text><text x="90" y="1440" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">SDK 事件 → 自有内容更新</text><text x="90" y="1469" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">图状态与 checkpoint 留在适配内部。</text><text x="1130" y="1406" font-size="25" fill="#60a5fa" text-anchor="start" font-weight="650">工具适配</text><text x="1130" y="1440" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">GitHub / MCP / 访问范围</text><text x="1130" y="1469" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">专业限制组合到共同动作机制。</text><text x="90" y="1636" font-size="25" fill="#60a5fa" text-anchor="start" font-weight="650">llm · 模型与网络适配</text><text x="610" y="1486" font-size="25" fill="#34d399" text-anchor="start" font-weight="650">业务数据库</text><text x="610" y="1520" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">各模块拥有数据，共用事务机制。</text><text x="1130" y="1636" font-size="25" fill="#60a5fa" text-anchor="start" font-weight="650">GitHub 等外部系统</text><text x="470" y="891" font-size="19" fill="#a78bfa" text-anchor="start" font-weight="400">接受 / 调度</text><text x="1080" y="891" font-size="19" fill="#fbbf24" text-anchor="start" font-weight="400">完成意图</text><text x="70" y="1080" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">实线：运行时调用与保存</text><text x="70" y="1115" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">虚线：经契约注入或完成回调</text><text x="70" y="1730" font-size="22" fill="#e2e8f0" text-anchor="start" font-weight="400">正式交付统一读取 RunResult（正文与结构化报告）；progress 仅表达过程，Message 引用结果。</text><text x="50" y="65" font-size="36" fill="#e2e8f0" text-anchor="start" font-weight="700">建议的职责关系｜共同执行机制，专业规则提供确定输入</text><text x="50" y="108" font-size="22" fill="#94a3b8" text-anchor="start" font-weight="400">这是待实施示例。保留模块化单体、共享数据库和两个业务事务，不增加微服务或消息总线。</text><text x="1550" y="1775" font-size="17" fill="#94a3b8" text-anchor="end" font-weight="400">NIUMACREW · PROPOSED · OWNERSHIP · 2026-10-26</text></svg>