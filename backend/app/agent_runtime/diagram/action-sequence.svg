<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1200" role="img" aria-label="运行中的 Agent：一次模型或工具动作怎样被允许">
<defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="#94a3b8"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif;fill:#e2e8f0}.sub{fill:#94a3b8}.edge{fill:none;stroke:#94a3b8;stroke-width:1.6;marker-end:url(#a)}</style>
<rect width="1500" height="1200" fill="#0f172a"/>
<text x="40" y="48" font-size="26" font-weight="600">运行中的 Agent：一次模型或工具动作怎样被允许</text>
<text x="40" y="82" font-size="16" class="sub">时间由上往下；虚线为返回。图中展开一轮动作，实际循环可多次往返。</text>
<line x1="150" y1="185" x2="150" y2="1110" stroke="#475569" stroke-dasharray="6 5"/>
<line x1="450" y1="185" x2="450" y2="1110" stroke="#475569" stroke-dasharray="6 5"/>
<line x1="750" y1="185" x2="750" y2="1110" stroke="#475569" stroke-dasharray="6 5"/>
<line x1="1050" y1="185" x2="1050" y2="1110" stroke="#475569" stroke-dasharray="6 5"/>
<line x1="1350" y1="185" x2="1350" y2="1110" stroke="#475569" stroke-dasharray="6 5"/>
<rect x="30" y="330" width="1440" height="480" rx="8" fill="none" stroke="#60a5fa" stroke-dasharray="7 4"/>
<text x="270" y="350" text-anchor="middle" font-size="14">每次模型 / 工具实际动作</text>
<path class="edge" d="M150 235H450"/>
<text x="300.0" y="223" text-anchor="middle" font-size="15">1 提供固定输入与受限资源</text>
<path class="edge" d="M450 295H750"/>
<text x="600.0" y="283" text-anchor="middle" font-size="15">2 组装模型、方法和中间件</text>
<path class="edge" d="M750 385H1050"/>
<text x="900.0" y="373" text-anchor="middle" font-size="15">3 请求模型或工具动作</text>
<path class="edge" d="M1050 445H150"/>
<text x="600.0" y="433" text-anchor="middle" font-size="15">4 申请当前授权、预算及开始记录</text>
<path class="edge" d="M150 505H1050" stroke-dasharray="6 4"/>
<text x="600.0" y="493" text-anchor="middle" font-size="15">5 持久成功后允许</text>
<path class="edge" d="M1050 570H1350"/>
<text x="1200.0" y="558" text-anchor="middle" font-size="15">6 发起实际外部请求</text>
<path class="edge" d="M1350 635H1050" stroke-dasharray="6 4"/>
<text x="1200.0" y="623" text-anchor="middle" font-size="15">7 取得结果或失败</text>
<path class="edge" d="M1050 700H150"/>
<text x="600.0" y="688" text-anchor="middle" font-size="15">8 完成动作并报告普通进展</text>
<path class="edge" d="M1050 765H750" stroke-dasharray="6 4"/>
<text x="900.0" y="753" text-anchor="middle" font-size="15">9 结果进入 SDK 后续循环</text>
<path class="edge" d="M750 860H450" stroke-dasharray="6 4"/>
<text x="600.0" y="848" text-anchor="middle" font-size="15">10 流结束</text>
<path class="edge" d="M450 925H750"/>
<text x="600.0" y="913" text-anchor="middle" font-size="15">11 重新读取已保存图状态</text>
<path class="edge" d="M750 990H450" stroke-dasharray="6 4"/>
<text x="600.0" y="978" text-anchor="middle" font-size="15">12 完成标记、剩余步骤及最终消息</text>
<path class="edge" d="M450 1070H150" stroke-dasharray="6 4"/>
<text x="300.0" y="1058" text-anchor="middle" font-size="15">13 复核后返回候选与文件引用</text>
<rect x="25" y="115" width="250" height="75" rx="8" fill="#0f172a"/>
<rect x="25" y="115" width="250" height="75" rx="8" fill="#34d399" fill-opacity="0.1" stroke="#34d399"/>
<text x="150.0" y="147" text-anchor="middle" font-size="20" font-weight="600">执行宿主</text>
<text class="sub" x="150.0" y="174" text-anchor="middle" font-size="15">提供控制，最终交业务发布</text>
<rect x="325" y="115" width="250" height="75" rx="8" fill="#0f172a"/>
<rect x="325" y="115" width="250" height="75" rx="8" fill="#34d399" fill-opacity="0.1" stroke="#34d399"/>
<text x="450.0" y="147" text-anchor="middle" font-size="20" font-weight="600">执行入口</text>
<text class="sub" x="450.0" y="174" text-anchor="middle" font-size="15">langchain.execute_agent</text>
<rect x="625" y="115" width="250" height="75" rx="8" fill="#0f172a"/>
<rect x="625" y="115" width="250" height="75" rx="8" fill="#34d399" fill-opacity="0.1" stroke="#34d399"/>
<text x="750.0" y="147" text-anchor="middle" font-size="20" font-weight="600">SDK 循环</text>
<text class="sub" x="750.0" y="174" text-anchor="middle" font-size="15">create_agent / astream</text>
<rect x="925" y="115" width="250" height="75" rx="8" fill="#0f172a"/>
<rect x="925" y="115" width="250" height="75" rx="8" fill="#34d399" fill-opacity="0.1" stroke="#34d399"/>
<text x="1050.0" y="147" text-anchor="middle" font-size="20" font-weight="600">平台中间件</text>
<text class="sub" x="1050.0" y="174" text-anchor="middle" font-size="15">模型 / 方法 / 工具约束</text>
<rect x="1225" y="115" width="250" height="75" rx="8" fill="#0f172a"/>
<rect x="1225" y="115" width="250" height="75" rx="8" fill="#34d399" fill-opacity="0.1" stroke="#34d399"/>
<text x="1350.0" y="147" text-anchor="middle" font-size="20" font-weight="600">模型或工具服务</text>
<text class="sub" x="1350.0" y="174" text-anchor="middle" font-size="15">实际外部请求</text>
<text x="750" y="1155" text-anchor="middle" font-size="16">流结束、工具成功或出现文字都不等于正式交付；候选还要经过 conversations 的发布事务。</text>
</svg>