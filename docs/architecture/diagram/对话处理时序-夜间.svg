<path class="return" d="M360 1586H120"/>
<text class="label" x="240.0" y="1575" text-anchor="middle">正式回复（SSE）</text>
<rect class="note" x="28" y="1602" width="280" height="28" rx="6"/>
<text class="caption" x="168.0" y="1622" text-anchor="middle">正式回复与成果可见</text>
<rect class="note" x="754" y="1602" width="622" height="28" rx="6"/>
<text class="caption" x="1065.0" y="1622" text-anchor="middle">本轮资源先收尾再提交终态；接纳以持久记录为准</text>
<rect class="note" x="40" y="1648" width="328" height="156" rx="10"/>
<text class="section" x="56" y="1677">提交与重放</text>
<text class="branch" x="56" y="1704">回执未知：原键核对或重发</text>
<text class="branch" x="56" y="1728">同键重放返回原记录（200）</text>
<text class="branch" x="56" y="1752">准入拒绝不创建新 Run</text>
<text class="branch" x="56" y="1776">续聊保留会话，每轮新 Run</text>
<rect class="note" x="384" y="1648" width="328" height="156" rx="10"/>
<text class="section" x="400" y="1677">断线与停止</text>
<text class="branch" x="400" y="1704">断线只停观察，执行继续</text>
<text class="branch" x="400" y="1728">重连只读当前快照</text>
<text class="branch" x="400" y="1752">显式停止才登记取消</text>
<text class="branch" x="400" y="1776">排队取消可直接结束</text>
<rect class="note" x="728" y="1648" width="328" height="156" rx="10"/>
<text class="section" x="744" y="1677">失败与恢复</text>
<text class="branch" x="744" y="1704">失败、超时、撤权保留终态</text>
<text class="branch" x="744" y="1728">可信检查点按恢复资格续跑</text>
<text class="branch" x="744" y="1752">副作用与未知结果不重放</text>
<text class="branch" x="744" y="1776">失败回复的明确重试建新 Run</text>
<rect class="note" x="1072" y="1648" width="328" height="156" rx="10"/>
<text class="section" x="1088" y="1677">接纳与续聊</text>
<text class="branch" x="1088" y="1704">临时失败只重试接纳</text>
<text class="branch" x="1088" y="1728">明确拒绝记录业务失败</text>
<text class="branch" x="1088" y="1752">不改写已成功 Run</text>
<text class="branch" x="1088" y="1776">续聊使用最近已接纳基点</text>
</svg>
