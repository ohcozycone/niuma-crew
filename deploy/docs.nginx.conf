server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    error_log /dev/stderr warn;
    location = / { return 302 /docs/; }
    location = /docs { return 301 /docs/; }
    location /docs/ { try_files $uri $uri/ =404; }
    error_page 404 /docs/404.html;
}
