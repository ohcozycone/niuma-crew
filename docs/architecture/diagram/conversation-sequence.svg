<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1210" role="img" aria-labelledby="title desc">
<title id="title">一次对话：从提交到正式交付</title><desc id="desc">时间由上至下。请求先原子接受，宿主领取后调用 Agent；动作先授权记账再执行，候选结果经业务事务发布，浏览器只观察已保存状态。</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="#94a3b8"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#e2e8f0} .muted{fill:#94a3b8} .line{fill:none;stroke:#94a3b8;stroke-width:1.7;marker-end:url(#arrow)}</style>
<rect width="1560" height="1210" fill="#0f172a"/><rect width="1560" height="1210" fill="url(#grid)"/>
<text x="40" y="48" font-size="26" font-weight="700">一次对话：从提交到正式交付</text>
<text class="muted" x="40" y="82" font-size="16">时间从上往下 · 返回使用虚线 · 业务、宿主与 Agent 在同一后端进程中协作</text>
<line x1="130" y1="205" x2="130" y2="1135" stroke="#475569" stroke-dasharray="6 5"/>
<line x1="390" y1="205" x2="390" y2="1135" stroke="#475569" stroke-dasharray="6 5"/>
<line x1="650" y1="205" x2="650" y2="1135" stroke="#475569" stroke-dasharray="6 5"/>
<line x1="910" y1="205" x2="910" y2="1135" stroke="#475569" stroke-dasharray="6 5"/>
<line x1="1170" y1="205" x2="1170" y2="1135" stroke="#475569" stroke-dasharray="6 5"/>
<line x1="1430" y1="205" x2="1430" y2="1135" stroke="#475569" stroke-dasharray="6 5"/>
<rect x="565" y="605" width="965" height="245" rx="8" fill="#1e293b" fill-opacity="0.35" stroke="#60a5fa" stroke-dasharray="6 4"/>
<text x="580" y="625" font-size="14" style="fill:#60a5fa">每次实际动作都先复核、记账，再调用；本图仅展开一轮</text>
<path class="line" d="M130 250H390"/>
<text x="260.0" y="239" font-size="14" text-anchor="middle">1 发送固定标识与输入</text>
<path class="line" d="M390 310H650"/>
<text x="520.0" y="299" font-size="14" text-anchor="middle">2 保存输入、空回复和 Run</text>
<path class="line" d="M650 370H390" stroke-dasharray="6 4"/>
<text x="520.0" y="359" font-size="14" text-anchor="middle">3 接受事务提交</text>
<path class="line" d="M390 430H130" stroke-dasharray="6 4"/>
<text x="260.0" y="419" font-size="14" text-anchor="middle">4 返回已接受的回复标识</text>
<path class="line" d="M130 490H390"/>
<text x="260.0" y="479" font-size="14" text-anchor="middle">5 建立只读观察连接</text>
<path class="line" d="M910 550H650"/>
<text x="780.0" y="539" font-size="14" text-anchor="middle">6 领取运行、读取固定依据</text>
<path class="line" d="M910 590H1170"/>
<text x="1040.0" y="579" font-size="14" text-anchor="middle">7 准备后调用 Agent</text>
<path class="line" d="M1170 670H910"/>
<text x="1040.0" y="659" font-size="14" text-anchor="middle">8 申请实际动作</text>
<path class="line" d="M910 730H650"/>
<text x="780.0" y="719" font-size="14" text-anchor="middle">9 授权、扣预算、保存开始</text>
<path class="line" d="M1170 790H1430"/>
<text x="1300.0" y="779" font-size="14" text-anchor="middle">10 调用模型或获准工具</text>
<path class="line" d="M1430 835H1170" stroke-dasharray="6 4"/>
<text x="1300.0" y="824" font-size="14" text-anchor="middle">11 返回结果</text>
<path class="line" d="M1170 900H910" stroke-dasharray="6 4"/>
<text x="1040.0" y="889" font-size="14" text-anchor="middle">12 返回候选正文与文件引用</text>
<path class="line" d="M910 965H390"/>
<text x="650.0" y="954" font-size="14" text-anchor="middle">13 请求业务发布</text>
<path class="line" d="M390 1030H650"/>
<text x="520.0" y="1019" font-size="14" text-anchor="middle">14 提交正文、附件与终态</text>
<path class="line" d="M390 1095H130" stroke-dasharray="6 4"/>
<text x="260.0" y="1084" font-size="14" text-anchor="middle">15 推送已保存的正式状态</text>
<rect x="20" y="130" width="220" height="75" rx="9" fill="#0f172a"/>
<rect x="20" y="130" width="220" height="75" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee" stroke-width="1.6"/>
<text x="130.0" y="160" text-anchor="middle" font-size="20" font-weight="600">浏览器</text>
<text class="muted" x="130.0" y="187" text-anchor="middle" font-size="15">页面与观察</text>
<rect x="280" y="130" width="220" height="75" rx="9" fill="#0f172a"/>
<rect x="280" y="130" width="220" height="75" rx="9" fill="#34d399" fill-opacity="0.09" stroke="#34d399" stroke-width="1.6"/>
<text x="390.0" y="160" text-anchor="middle" font-size="20" font-weight="600">API / 对话业务</text>
<text class="muted" x="390.0" y="187" text-anchor="middle" font-size="15">准备、授权组合、交付</text>
<rect x="540" y="130" width="220" height="75" rx="9" fill="#0f172a"/>
<rect x="540" y="130" width="220" height="75" rx="9" fill="#fb923c" fill-opacity="0.09" stroke="#fb923c" stroke-width="1.6"/>
<text x="650.0" y="160" text-anchor="middle" font-size="20" font-weight="600">业务数据库</text>
<text class="muted" x="650.0" y="187" text-anchor="middle" font-size="15">消息、运行与动作</text>
<rect x="800" y="130" width="220" height="75" rx="9" fill="#0f172a"/>
<rect x="800" y="130" width="220" height="75" rx="9" fill="#60a5fa" fill-opacity="0.09" stroke="#60a5fa" stroke-width="1.6"/>
<text x="910.0" y="160" text-anchor="middle" font-size="20" font-weight="600">执行宿主</text>
<text class="muted" x="910.0" y="187" text-anchor="middle" font-size="15">调度与看护</text>
<rect x="1060" y="130" width="220" height="75" rx="9" fill="#0f172a"/>
<rect x="1060" y="130" width="220" height="75" rx="9" fill="#a78bfa" fill-opacity="0.09" stroke="#a78bfa" stroke-width="1.6"/>
<text x="1170.0" y="160" text-anchor="middle" font-size="20" font-weight="600">Agent 循环</text>
<text class="muted" x="1170.0" y="187" text-anchor="middle" font-size="15">SDK 与资源适配</text>
<rect x="1320" y="130" width="220" height="75" rx="9" fill="#0f172a"/>
<rect x="1320" y="130" width="220" height="75" rx="9" fill="#94a3b8" fill-opacity="0.09" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1430.0" y="160" text-anchor="middle" font-size="20" font-weight="600">模型 / 工具</text>
<text class="muted" x="1430.0" y="187" text-anchor="middle" font-size="15">实际外部调用</text>
<text class="muted" x="40" y="1170" font-size="16">观察可贯穿排队和执行；断线只停止观察。停止、失败、撤权与恢复见正文；图示正常成功路径。</text>
</svg>