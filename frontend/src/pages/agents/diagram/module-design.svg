<rect x="605.0" y="356" width="70" height="24" rx="3" fill="#0f172a"/>
<text x="640.0" y="373" text-anchor="middle" font-size="14" class="label">进入配置</text>
<rect x="385.0" y="613" width="70" height="24" rx="3" fill="#0f172a"/>
<text x="420.0" y="630" text-anchor="middle" font-size="14" class="label">完整保存</text>
<rect x="818.0" y="613" width="84" height="24" rx="3" fill="#0f172a"/>
<text x="860.0" y="630" text-anchor="middle" font-size="14" class="label">已确认结果</text>
<rect x="818.0" y="390" width="84" height="24" rx="3" fill="#0f172a"/>
<text x="860.0" y="407" text-anchor="middle" font-size="14" class="label">更新及刷新</text>
<text x="40" y="52" text-anchor="start" font-size="26" class="title">员工目录、配置与展示：内部结构与协作</text>
<text x="40" y="88" font-size="16" class="muted">节点对应实际实现；箭头标明调用或数据交付，具体事务和授权边界见正文。</text>
<text x="40" y="875" font-size="15" class="muted">当前实现的模块协作图；目录结构和图中职责不表示已经独立部署为多个服务。</text>
