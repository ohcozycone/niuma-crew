<rect class="note" x="944" y="322" width="440" height="28" rx="6"/>
<text class="caption" x="1164.0" y="342" text-anchor="middle">执行侧冻结输入与配置</text>
<path class="call" d="M840 358H600"/>
<text class="label" x="720.0" y="347" text-anchor="middle">保存 Run 与输入快照</text>
<path class="call" d="M360 396H600"/>
<text class="label" x="480.0" y="385" text-anchor="middle">关联空回复与 Run</text>
<rect class="note" x="282" y="416" width="660" height="28" rx="6"/>
<text class="caption" x="612.0" y="436" text-anchor="middle">消息、Run、文件关联与业务关联同事务提交</text>
<path class="return" d="M360 474H120"/>
