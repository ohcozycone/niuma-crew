<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1620" role="img" aria-labelledby="title desc">
<title id="title">前端分层｜围绕页面、交互和状态组织</title>
<desc id="desc">Hook 面向组件使用方式，API 面向稳定操作；两者都不要求与后端实体或文件一一对应。 实线表示已有职责，虚线表示后续未实现能力；当前范围已实施。</desc>
