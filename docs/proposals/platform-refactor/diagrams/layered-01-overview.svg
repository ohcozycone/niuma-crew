<title id="title">全局架构｜先分职责层，再看模块归属</title>
<desc id="desc">主区自上而下区分界面、接口、业务协作和执行；侧栏单列横切、工程与未来能力。 实线表示已有职责，虚线表示后续未实现能力；当前范围已实施。</desc>
