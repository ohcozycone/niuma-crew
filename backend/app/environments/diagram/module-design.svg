<text x="200" y="249" text-anchor="middle" font-size="15" class="muted">capture_profile / for_run</text>
<text x="200" y="278" text-anchor="middle" font-size="15" class="">核对当前部署验收依据</text>
<rect x="480" y="180" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="480" y="180" width="320" height="170" rx="10" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.6"/>
<text x="640" y="215" text-anchor="middle" font-size="21" class="title">资源申请事务</text>
<text x="640" y="249" text-anchor="middle" font-size="15" class="muted">service.py + models.py</text>
<text x="640" y="278" text-anchor="middle" font-size="15" class="">先保存申请，检查容量</text>
<rect x="920" y="180" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="920" y="180" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="1080" y="215" text-anchor="middle" font-size="21" class="title">远端环境</text>
<text x="1080" y="249" text-anchor="middle" font-size="15" class="muted">open_sandbox.py / OpenSandbox</text>
<text x="1080" y="278" text-anchor="middle" font-size="15" class="">按部署和申请标识创建</text>
<rect x="40" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="40" y="560" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="200" y="595" text-anchor="middle" font-size="21" class="title">命令与文件适配</text>
<text x="200" y="629" text-anchor="middle" font-size="15" class="muted">agent/workspace.py：协议适配</text>
<text x="200" y="658" text-anchor="middle" font-size="15" class="">open_sandbox.py：执行与收集</text>
<rect x="480" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="480" y="560" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="640" y="595" text-anchor="middle" font-size="21" class="title">释放与后台核对</text>
<text x="640" y="629" text-anchor="middle" font-size="15" class="muted">release / sweep</text>
<text x="640" y="658" text-anchor="middle" font-size="15" class="">记录销毁结果，保留未知责任</text>
<rect x="920" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="920" y="560" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
