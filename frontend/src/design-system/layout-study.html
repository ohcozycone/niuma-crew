<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NiumaCrew 布局尺寸对照</title>
    <!-- Design-only geometry study. Visual values load from theme.css; the embedded role is the existing designer-bull.svg asset. No API or persistence. -->
    <link rel="stylesheet" href="./theme.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--os-canvas);
        color: var(--os-text);
        font:
          14px/1.65 system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      h2 {
        margin: 32px 0 12px;
        font-size: 20px;
      }
      p {
        margin: 0 0 16px;
      }
      .intro {
        max-width: 72ch;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 16px;
        padding: 20px 0;
        border-block: 1px solid var(--os-border);
      }
      label {
        display: grid;
        gap: 8px;
      }
      select,
      button {
        min-height: 36px;
        padding: 8px 12px;
        border: 1px solid var(--os-input);
        border-radius: 8px;
        background: var(--os-surface);
        color: var(--os-text);
        font: inherit;
      }
      input[type="checkbox"] {
        width: 20px;
        height: 20px;
      }
      .check {
        display: flex;
        align-items: center;
        min-height: 44px;
        gap: 8px;
      }
      :focus-visible {
        outline: 2px solid var(--os-focus);
        outline-offset: 3px;
      }
      output {
        display: block;
        margin-block: 16px;
        font-variant-numeric: tabular-nums;
      }
      .stage {
        width: 100%;
        overflow: auto;
        border: 1px solid var(--os-border);
        background: var(--os-surface);
      }
      .screen {
        position: relative;
        overflow: hidden;
      }
      iframe {
        display: block;
        border: 0;
        transform-origin: top left;
        background: var(--os-canvas);
      }
      .matrix {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
        gap: 24px;
      }
      .matrix article {
        min-width: 0;
      }
      .matrix h3 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      .matrix .screen {
        border: 1px solid var(--os-border);
      }
      .matrix button {
        margin-top: 8px;
      }
      .hint {
        color: var(--os-text-muted);
      }
      @media (width < 600px) {
        body {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <h1>组件与容器的早期尺寸研究</h1>
    <p class="intro">
      此原型保留早期公共外框候选，不代表现行对话布局。对话现在使用 960 / 1120 / 1280px
      分档，规则与依据见 <a href="./layout.md">现行布局规范</a>，效果以正式组件为准。
    </p>
    <p class="intro">
      这是目标布局的几何原型，使用演示内容和正式角色资产，未接入业务 API。缩放只影响预览显示；iframe
      内部保持标注的 CSS
      视口宽度。它用于检查列数、留白和重排，不能替代正式组件、交互或可访问性验收。
    </p>
    <div class="controls">
      <label
        >查看模式<select id="scene" aria-label="查看模式">
          <option value="agents">员工卡片</option>
          <option value="capabilities">简单能力卡片</option>
          <option value="connections">复杂连接卡片</option>
          <option value="configuration">主辅配置</option>
          <option value="editor">文件编辑</option>
          <option value="conversation">对话与宽内容</option>
          <option value="feedback">列表、反馈与任务浮层</option>
        </select></label
      >
      <label
        >预览视口<select id="viewport" aria-label="预览视口">
          <option>320</option>
          <option>390</option>
          <option>768</option>
          <option>1024</option>
          <option>1280</option>
          <option>1440</option>
          <option selected>1920</option>
          <option>2560</option>
        </select></label
      >
      <label
        >页面上限<select id="limit" aria-label="页面上限">
          <option>1280</option>
          <option>1440</option>
          <option>1450</option>
          <option selected>1536</option>
          <option>1600</option>
        </select></label
      >
      <label
        >文字尺寸<select id="font" aria-label="文字尺寸">
          <option value="1">默认</option>
          <option value="2">200%（原型字级）</option>
        </select></label
      >
      <label class="check"><input id="coarse" type="checkbox" />触屏命中区预算</label>
      <label class="check"><input id="night" type="checkbox" />夜间</label>
      <button id="oneToOne" type="button" aria-pressed="false">切换为 1:1 检视</button>
    </div>
    <output id="budget" aria-live="polite"></output>
    <div class="stage" id="stage"><div class="screen" id="focus-screen"></div></div>
    <h2>尺寸矩阵</h2>

        editor: () =>
          `${heading("技能文件编辑", "文件目录 240px，编辑区最低预算 560px。")}<div class="file-editor"><p class="file-note hint">演示文件，不写入磁盘或服务器</p><div class="file-layout" data-file-layout><nav class="files" aria-label="示例文件"><a href="#skill-editor">SKILL.md</a><a href="#skill-editor">references/project-layout-requirements-and-examples.md</a><a href="#skill-editor">scripts/check-layout.py</a></nav><div class="code-editor"><h2>SKILL.md</h2><textarea id="skill-editor" aria-label="示例代码编辑器" readonly># 处理说明\n\n1. 核对输入与来源。\n2. 按模块输出结果。\n3. 保留可复核的证据。\n\n这是一段较长的内容，编辑区应具备足够的宽度与高度。</textarea></div></div></div>`,
        conversation: () =>
          `${heading("与员工对话", "文字、代码、表格和输入分别使用自己的空间规则。")}<div class="chat"><div class="messages" data-messages><article class="message user" id="q-1"><p>请比较这三个布局方案，并说明对列表、配置和对话分别有什么影响。</p></article><article class="message"><header><img class="avatar" src="${AVATAR_DATA}" alt=""/><span>设计研究与方案顾问 · 演示回复</span></header><div class="prose" data-prose><p>页面宽度应该从组件的任务和内容出发。员工卡片需要同时展示角色、姓名、岗位和配置状态，复杂的连接卡片还需要账号、模型与检查反馈。使用同一页宽，不代表所有组件都应该以相同的列数排列。</p><p>这一段专门用于观察较长中文内容的行长。消息本身保留宽工作区，普通段落局部限制测量宽度。表格与代码可以使用消息区空间，不会因为文字阅读列而被一起挤窄。上述内容是演示，不是已经完成的产品验收结果。</p></div><div class="scroll" tabindex="0" aria-label="示例比较表格"><table><thead><tr><th>方案</th><th>适用内容</th><th>主要取舍</th><th>响应式行为</th></tr></thead><tbody><tr><td>资源目录</td><td>员工、能力与复杂连接</td><td>按不同卡片预算确定列数</td><td>不足时减少列数</td></tr><tr><td>配置工作区</td><td>字段、说明、预览</td><td>先保证主要编辑区</td><td>辅区移到下方</td></tr><tr><td>对话工作区</td><td>文字、代码、表格与输入</td><td>区分工作区与文字行长</td><td>二维内容局部滚动</td></tr></tbody></table></div><div class="scroll" tabindex="0" aria-label="示例代码块"><pre>const columns = Math.max(1, Math.floor((availableContentWidth + gridGap) / (componentMinimumWidth + gridGap)));\nconst pageFrame = Math.min(workspaceAvailableWidth, recommendedPageMaximumWidth);</pre></div></article><article class="message user" id="q-2"><p>如果把窗口缩小，主要操作和数据还可以正常读取吗？</p></article><article class="message" id="q-3"><div class="prose"><p>需要分别核对导航、字段、主辅区、消息与二维内容。原型可以验证几何关系，正式接入后还需要验证键盘、触屏、软键盘、消息历史与业务状态。</p></div></article></div><nav class="ruler" aria-label="示例问题定位"><a href="#q-1" aria-label="定位第一个问题"></a><a href="#q-2" aria-label="定位第二个问题"></a><a href="#q-3" aria-label="定位第三个问题"></a></nav><footer class="composer"><div class="input-group"><textarea aria-label="示例对话输入" readonly>输入区域使用工作区空间；这是只读演示，不会提交消息。</textarea><div class="actions"><select aria-label="示例工作方式"><option>普通对话</option></select><button type="button" data-demo-action>检视输入尺寸</button></div></div></footer></div>`,
        feedback: () =>
          `${heading("记录与任务反馈", "列表、状态与浮层采用不同的空间类型。")}<div class="list">${[1, 2, 3].map((i) => `<article class="row"><div class="row-inner"><div class="row-copy"><strong>关于项目资料与多阶段交付要求的历史讨论 ${i}</strong><p class="hint">较长标题允许在主信息区域重排。</p></div><div class="row-meta"><span class="hint">2026-10-30</span><span class="status">已完成</span><button type="button" data-demo-action>查看</button></div></div></article>`).join("")}</div><div class="pagination"><span>共 60 项 · 第 1 页</span><div class="actions"><button type="button" disabled>上一页</button><button type="button" data-demo-action>下一页示例</button></div></div><div class="notice"><p>连接检查失败的演示。原有输入继续保留，可以更正后重试，较长的技术地址不会推动整页横向滚动：https://example.invalid/very-long-connection-identifier-and-configuration-path</p><div class="actions"><button type="button" data-demo-action>检视重试操作</button></div></div><section class="modal-demo panel" aria-label="标准任务浮层尺寸示例"><div class="panel-inner"><button class="close-example" type="button" aria-label="关闭示例（只演示命中区）" data-demo-action>×</button><h2 class="modal-title">标准任务容器 · 非模态演示</h2><p class="hint">640px 外框，根据视口收缩。没有模拟焦点锁定。</p>${fields()}<div class="actions"><button type="button" data-demo-action>取消示例</button><button type="button" disabled>完成示例</button></div></div></section>`,
      };
      function source(mode, all = false) {
        const selected = all ? Object.keys(sections) : [mode];
        return `<!doctype html><html lang="zh-CN" data-theme="${$("night").checked ? "dark" : "light"}"><head><meta charset="utf-8"><link rel="stylesheet" href="./theme.css"><style>:root{--factor:${$("font").value};--limit:${$("limit").value}px}${css}</style></head><body class="${$("coarse").checked ? "coarse" : ""}"><div class="shell"><aside class="sidebar"><strong>NiumaCrew</strong><nav aria-label="示例主导航"><a href="#agents">数字员工</a><a href="#capabilities">能力库</a><a href="#conversation">对话记录</a><a href="#feedback">知识与资料</a></nav><p class="hint">目标侧栏 240px。\n所有业务内容均为演示。</p></aside><div class="work"><header class="topbar"><span>工作台 › 布局原型</span><span class="hint">目标设计 · 未迁入正式页面</span></header><main class="frame" data-frame>${selected.map((key) => `<section id="${key}" data-mode="${key}">${sections[key]()}</section>`).join("")}</main></div></div></body></html>`;
      }
      function fit(screen, frame, width, focus) {
        const available = focus ? $("stage").clientWidth : screen.parentElement.clientWidth;
        const scale = focus && oneToOne ? 1 : Math.min(1, available / width);
        frame.style.width = width + "px";
        frame.style.height = (focus ? 900 : 1800) + "px";
        frame.style.transform = `scale(${scale})`;
        screen.style.width = (focus && oneToOne ? width : available) + "px";
        screen.style.height = Math.ceil((focus ? 900 : 1800) * scale) + "px";
        if (frame.contentDocument?.querySelector("[data-frame]")) measure(screen, frame, width);
      }
      function measure(screen, el, width) {
        const d = el.contentDocument,
          w = el.contentWindow,
          q = (s) => d.querySelector(s),
          style = (e) => w.getComputedStyle(e),
          columns = (e) => style(e).gridTemplateColumns.split(" ").length;
        const base = q("[data-frame]");
        if (!base) return;
        const result = {
          viewport: width,
          frame: base.clientWidth,
          gutter: parseFloat(style(base).paddingLeft),
          content: base.clientWidth - parseFloat(style(base).paddingLeft) * 2,
          rootOverflow: d.documentElement.scrollWidth > w.innerWidth,
          grids: [...d.querySelectorAll("[data-grid]")].map((e) => ({
            type: e.dataset.grid,
            columns: columns(e),
            width: parseFloat(style(e.firstElementChild).width),
          })),
          configColumns: q("[data-config]") ? columns(q("[data-config]")) : null,
          fileColumns: q("[data-file-layout]") ? columns(q("[data-file-layout]")) : null,
          proseWidth: q("[data-prose]") ? parseFloat(style(q("[data-prose]")).width) : null,
          messagePadding: q("[data-messages]")
            ? parseFloat(style(q("[data-messages]")).paddingRight)
            : null,
          tableViewport: q(".scroll") ? q(".scroll").clientWidth : null,
          tableScroll: q(".scroll") ? q(".scroll").scrollWidth : null,
          fieldColumns: [...d.querySelectorAll("[data-fields]")].map(columns),
          fieldWidths: [...d.querySelectorAll("[data-fields] input")].map((e) =>
            parseFloat(style(e).width),
          ),
          targets: [...d.querySelectorAll(".ruler a")].map((e) => ({
            width: parseFloat(style(e).width),
            height: parseFloat(style(e).height),
          })),
        };
        let data = screen.parentElement.querySelector(":scope > details");
        if (!data) {
          data = document.createElement("details");
          const summary = document.createElement("summary");
          summary.textContent = "实际布局数据";
          data.append(summary, document.createElement("pre"));
          screen.parentElement.append(data);
        }
        data.querySelector("pre").textContent = JSON.stringify(result, null, 2);
        data.dataset.measurement = JSON.stringify(result);
      }
      function frame(screen, width, all, focus = false) {
        const el = document.createElement("iframe");
        el.title = `${width}px ${all ? "完整尺寸矩阵" : $("scene").selectedOptions[0].textContent}`;
        el.dataset.viewport = width;
        el.srcdoc = source($("scene").value, all);
        screen.replaceChildren(el);
        el.addEventListener("load", () => {
          fit(screen, el, width, focus);
          el.contentDocument.addEventListener("click", (event) => {
            const b = event.target.closest("[data-demo-action]");
            if (b) {
              b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true");
              b.title = `演示元素：${Math.round(b.getBoundingClientRect().width)} × ${Math.round(b.getBoundingClientRect().height)} CSS px`;
            }
          });
        });
        return el;
      }
      function render() {
        document.documentElement.dataset.theme = $("night").checked ? "dark" : "light";
        const v = Number($("viewport").value),
          s = v < 768 ? 0 : 240,
          a = v - s,
          g = a < 640 ? 16 : a < 1200 ? 24 : 32,
          f = Math.min(a, Number($("limit").value)),
          c = f - 2 * g;
        $("budget").textContent =
          `视口 ${v}px · 侧栏 ${s}px · 右侧可用 ${a}px · 外框 ${f}px · 单侧留白 ${g}px · 内容 ${c}px。主辅区${c >= 1008 ? "并列" : "堆叠"}。`;
        frame($("focus-screen"), v, false, true);
        $("matrix").replaceChildren();
        for (const width of sizes) {
          const article = document.createElement("article");
          const h = document.createElement("h3");
          h.textContent = width + " CSS px";
          const screen = document.createElement("div");
          screen.className = "screen";
          const button = document.createElement("button");
          button.textContent = "检视此尺寸";
          button.addEventListener("click", () => {
            $("viewport").value = String(width);
            render();
            $("stage").scrollIntoView({ block: "start" });
          });
          article.append(h, screen, button);
          $("matrix").append(article);
          frame(screen, width, true);
        }
      }
      for (const id of ["scene", "viewport", "limit", "font", "coarse", "night"])
        $(id).addEventListener("change", render);
      $("oneToOne").addEventListener("click", () => {
        oneToOne = !oneToOne;
        $("oneToOne").setAttribute("aria-pressed", String(oneToOne));
        $("oneToOne").textContent = oneToOne ? "切换为适应窗口" : "切换为 1:1 检视";
        render();
      });
      new ResizeObserver(() => {
        for (const el of document.querySelectorAll("iframe"))
          fit(
            el.parentElement,
            el,
            Number(el.dataset.viewport),
            el.parentElement.id === "focus-screen",
          );
      }).observe(document.body);
      render();
    </script>
