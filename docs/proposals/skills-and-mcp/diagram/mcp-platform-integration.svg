<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" role="img" aria-labelledby="title description">
  <title id="title">MCP 平台接入与员工装配：拟议架构</title>
  <desc id="description">统一能力库管理 MCP 服务、账号和目录；员工保存明确工具许可；现有 Agent 循环通过受控适配器调用远端 MCP。OAuth 使用浏览器授权和固定后端回调。所有平台模块仍在当前后端应用内。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#94a3b8"/></marker>
    <marker id="green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#34d399"/></marker>
    <style>
      text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif;fill:#f1f5f9}
      .title{font-size:22px;font-weight:700}.name{font-size:16px;font-weight:600}.detail{font-size:12px;fill:#94a3b8}.label{font-size:11px;fill:#cbd5e1}.region{font-size:13px;fill:#fbbf24}.note{font-size:13px;fill:#cbd5e1}
      .line{fill:none;stroke:#94a3b8;stroke-width:1.8;marker-end:url(#arrow)}.call{fill:none;stroke:#34d399;stroke-width:2;marker-end:url(#green)}
    </style>
  </defs>
  <rect width="1280" height="840" fill="#0f172a"/>
  <rect width="1280" height="840" fill="url(#grid)"/>
  <rect x="20" y="220" width="1240" height="300" rx="14" fill="none" stroke="#fbbf24" stroke-dasharray="8 4"/>
  <text x="40" y="242" class="region">现有 Python 后端应用 · 模块化单体 · 不增加独立微服务</text>
  <path class="line" d="M210 170V265"/>
  <path class="line" d="M630 170V265"/>
  <path class="line" d="M1050 170V265"/>
  <path class="line" d="M210 335V410"/>
  <path class="line" d="M380 300H420V445H460"/>
  <path class="line" d="M630 335V410"/>
  <path class="call" d="M800 300H880"/>
  <path class="call" d="M1050 335V410"/>
  <path class="line" d="M800 445H880"/>
  <path class="line" d="M210 480V625"/>
  <path class="line" d="M380 455H420V570H630V625"/>
  <path class="call" d="M1050 480V625"/>
  <text x="220" y="198" class="label">新增 / 编辑 / 检查更新</text>
  <text x="640" y="198" class="label">一次保存员工完整装配</text>
  <text x="1060" y="198" class="label">Conversation → Run</text>
  <text x="220" y="375" class="label">认证接线</text>
  <text x="640" y="375" class="label">只选已确认目录</text>
  <text x="838" y="282" class="label" text-anchor="middle">冻结依据</text>
  <text x="838" y="429" class="label" text-anchor="middle">复核定义</text>
  <text x="1060" y="375" class="label">记账 → 授权 → 调用</text>
  <text x="220" y="560" class="label">加密持久化 / 短期会话</text>
  <text x="470" y="558" class="label">metadata / 授权码 / Token</text>
  <text x="1060" y="560" class="label">选定账号 / 原始工具名</text>
  <g>
    <rect x="40" y="100" width="340" height="70" rx="8" fill="#0f172a"/>
    <rect x="40" y="100" width="340" height="70" rx="8" fill="#083344" fill-opacity=".55" stroke="#22d3ee"/>
    <text x="210" y="128" class="name" text-anchor="middle">能力库 / MCP 服务详情</text>
    <text x="210" y="150" class="detail" text-anchor="middle">服务卡片 · 账号连接 · 目录命名与确认</text>
    <rect x="460" y="100" width="340" height="70" rx="8" fill="#0f172a"/>
    <rect x="460" y="100" width="340" height="70" rx="8" fill="#083344" fill-opacity=".55" stroke="#22d3ee"/>
    <text x="630" y="128" class="name" text-anchor="middle">我的员工：能力装配</text>
    <text x="630" y="150" class="detail" text-anchor="middle">本人账号 · 操作开关 · 范围与预算</text>
    <rect x="880" y="100" width="340" height="70" rx="8" fill="#0f172a"/>
    <rect x="880" y="100" width="340" height="70" rx="8" fill="#083344" fill-opacity=".55" stroke="#22d3ee"/>
    <text x="1050" y="128" class="name" text-anchor="middle">现有对话页面</text>
    <text x="1050" y="150" class="detail" text-anchor="middle">问题 → 工具结果 → Agent 继续处理</text>
  </g>
  <g>
    <rect x="40" y="265" width="340" height="70" rx="8" fill="#0f172a"/>
    <rect x="40" y="265" width="340" height="70" rx="8" fill="#064e3b" fill-opacity=".5" stroke="#34d399"/>
    <text x="210" y="293" class="name" text-anchor="middle">tools：服务与连接管理</text>
    <text x="210" y="315" class="detail" text-anchor="middle">配置解析 · 独立凭证 · 引用与启停</text>
    <rect x="460" y="265" width="340" height="70" rx="8" fill="#0f172a"/>
    <rect x="460" y="265" width="340" height="70" rx="8" fill="#064e3b" fill-opacity=".5" stroke="#34d399"/>
    <text x="630" y="293" class="name" text-anchor="middle">agents：装配与许可</text>
    <text x="630" y="315" class="detail" text-anchor="middle">owner 校验 · 同事务保存 · 显式定义摘要</text>
    <rect x="880" y="265" width="340" height="70" rx="8" fill="#0f172a"/>
    <rect x="880" y="265" width="340" height="70" rx="8" fill="#064e3b" fill-opacity=".5" stroke="#34d399"/>
    <text x="1050" y="293" class="name" text-anchor="middle">现有 Runner / Agent 循环</text>
    <text x="1050" y="315" class="detail" text-anchor="middle">在后端运行 · 冻结主体 · 无 Token</text>
    <rect x="40" y="410" width="340" height="70" rx="8" fill="#0f172a"/>
    <rect x="40" y="410" width="340" height="70" rx="8" fill="#881337" fill-opacity=".4" stroke="#fb7185"/>
    <text x="210" y="438" class="name" text-anchor="middle">OAuth：官方 provider + 平台接线</text>
    <text x="210" y="460" class="detail" text-anchor="middle">浏览器授权 · 固定回调 · 刷新与断开</text>
    <rect x="460" y="410" width="340" height="70" rx="8" fill="#0f172a"/>
    <rect x="460" y="410" width="340" height="70" rx="8" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa"/>
    <text x="630" y="438" class="name" text-anchor="middle">每连接独立工具清单</text>
    <text x="630" y="460" class="detail" text-anchor="middle">本人目录：读取 → 候选 → 确认</text>
    <rect x="880" y="410" width="340" height="70" rx="8" fill="#0f172a"/>
    <rect x="880" y="410" width="340" height="70" rx="8" fill="#064e3b" fill-opacity=".5" stroke="#34d399"/>
    <text x="1050" y="438" class="name" text-anchor="middle">官方 MCPAdapter + 受控网络</text>
    <text x="1050" y="460" class="detail" text-anchor="middle">目标定义检查 · 等待后撤权复核</text>
  </g>
  <g>
    <rect x="40" y="625" width="340" height="80" rx="8" fill="#0f172a"/>
    <rect x="40" y="625" width="340" height="80" rx="8" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa"/>
    <text x="210" y="653" class="name" text-anchor="middle">现有 SQLite + 工具主密钥</text>
    <text x="210" y="675" class="detail" text-anchor="middle">owner / 连接 / 目录 / 许可 / OAuth 会话</text>
    <text x="210" y="693" class="detail" text-anchor="middle">Token 加密保存 · 业务模块各自拥有数据</text>
    <rect x="460" y="625" width="340" height="80" rx="8" fill="#0f172a"/>
    <rect x="460" y="625" width="340" height="80" rx="8" fill="#1e293b" fill-opacity=".65" stroke="#94a3b8"/>
    <text x="630" y="653" class="name" text-anchor="middle">外部 OAuth 授权服务</text>
    <text x="630" y="675" class="detail" text-anchor="middle">用户在服务方登录与确认授权</text>
    <text x="630" y="693" class="detail" text-anchor="middle">可与 MCP 不同域 · 端点分别校验</text>
    <rect x="880" y="625" width="340" height="80" rx="8" fill="#0f172a"/>
    <rect x="880" y="625" width="340" height="80" rx="8" fill="#1e293b" fill-opacity=".65" stroke="#94a3b8"/>
    <text x="1050" y="653" class="name" text-anchor="middle">外部 MCP 服务</text>
    <text x="1050" y="675" class="detail" text-anchor="middle">提供工具目录并执行具体业务操作</text>
    <text x="1050" y="693" class="detail" text-anchor="middle">远程工具运行在服务方，不启动本平台沙箱</text>
  </g>
  <text x="40" y="754" class="note">管理规则：本人连接的新增工具先确认，再授予本人员工；中文名与原始工具名同时保留。</text>
  <text x="40" y="780" class="note">运行规则：复核当前用户、员工 owner 与连接使用资格；Token 正常续期不等于更换账号。</text>
  <text x="40" y="806" class="detail">拟议架构 · 2026-10-28 · 箭头仅显示主要协作；目录和员工许可也通过各自模块读写同一数据库。</text>
  <text x="40" y="40" class="title">MCP 平台接入与员工装配</text>
  <text x="40" y="66" class="detail">本人能力与连接，复用现有执行底座；广场发布与复制不传递账号授权。</text>
</svg>
