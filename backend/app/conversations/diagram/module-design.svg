<text x="1080" y="658" text-anchor="middle" font-size="15" class="">读取已保存正文、状态和附件</text>
<rect x="385.0" y="233" width="70" height="24" rx="3" fill="#0f172a"/>
<text x="420.0" y="250" text-anchor="middle" font-size="14" class="label">命令事务</text>
