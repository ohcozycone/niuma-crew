<g text-anchor="middle"><text x="292" y="277">1. 输入与请求键</text><text x="618" y="351">2. 消息 + Run + 关联</text><text x="292" y="431">3. 已接受 Run</text><text x="938" y="506">4. 领取、冻结输入</text><text x="1265" y="596">5. 按 Run 驱动</text><text x="1265" y="681">6. 动作、候选结果</text><text x="775" y="766">7. 调用注入的发布用例</text><text x="618" y="856">8. 结果 + 消息 + 终态</text><text x="618" y="946">9. 读取持久快照</text><text x="292" y="1026">10. SSE 状态 / 结果</text></g>
<path d="M50 1120H1550" stroke="#334155"/>
<text x="50" y="1160" class="note">步骤 2 与 8 各为一个业务短事务；模型、工具和 SDK checkpoint 不占用业务事务。</text>
<text x="50" y="1194" class="note">SDK 完成后仍需业务发布；取消先被接受可阻止迟到成功。产品历史不读取 SDK 存档。</text>
<text x="1550" y="1235" text-anchor="end" class="sub">NIUMACREW / EXECUTION / CURRENT</text>
