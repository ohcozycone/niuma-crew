<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1700" role="img" aria-labelledby="title desc"><title id="title">运行时调度｜一次输入怎样成为已发布结果</title><desc id="desc">时间向下；实线为调用或写入，虚线为返回。HTTP 提交、后台执行、结果发布和只读观察分开。</desc><defs><marker id="a60a5fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#60a5fa"/></marker><marker id="a22d3ee" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#22d3ee"/></marker><marker id="a34d399" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#34d399"/></marker><marker id="aa78bfa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#a78bfa"/></marker><marker id="afbbf24" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#fbbf24"/></marker><marker id="afb7185" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#fb7185"/></marker><marker id="a94a3b8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#94a3b8"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;}</style><rect width="100%" height="100%" fill="#0f172a"/><path d="M120 245 V1530" stroke="#334155" stroke-width="2" stroke-dasharray="7 6"/><path d="M380 245 V1530" stroke="#334155" stroke-width="2" stroke-dasharray="7 6"/><path d="M640 245 V1530" stroke="#334155" stroke-width="2" stroke-dasharray="7 6"/><path d="M900 245 V1530" stroke="#334155" stroke-width="2" stroke-dasharray="7 6"/><path d="M1160 245 V1530" stroke="#334155" stroke-width="2" stroke-dasharray="7 6"/><path d="M1420 245 V1530" stroke="#334155" stroke-width="2" stroke-dasharray="7 6"/><path d="M1680 245 V1530" stroke="#334155" stroke-width="2" stroke-dasharray="7 6"/><path d="M 120,295 L 375,295" fill="none" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#a22d3ee)"/><path d="M 385,400 L 640,400" fill="none" stroke="#34d399" stroke-width="2.2" marker-end="url(#a34d399)"/><path d="M 375,495 L 120,495" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a94a3b8)"/><path d="M 895,590 L 640,590" fill="none" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#afbbf24)"/><path d="M 905,685 L 1680,685" fill="none" stroke="#fb7185" stroke-width="2.2" marker-end="url(#afb7185)"/><path d="M 905,785 L 1155,785" fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#a60a5fa)"/><path d="M 1165,880 L 1680,880" fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#a60a5fa)"/><path d="M 1155,980 L 640,980" fill="none" stroke="#34d399" stroke-width="2.2" marker-end="url(#a34d399)"/><path d="M 1155,1080 L 905,1080" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a60a5fa)"/><path d="M 905,1180 L 1415,1180" fill="none" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#aa78bfa)"/><path d="M 1415,1310 L 640,1310" fill="none" stroke="#34d399" stroke-width="2.2" marker-end="url(#a34d399)"/><path d="M 120,1430 L 640,1430" fill="none" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#a22d3ee)"/><path d="M 640,1515 L 120,1515" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a94a3b8)"/><rect x="15" y="175" width="210" height="70" rx="12" fill="#0f172a"/><rect x="15" y="175" width="210" height="70" rx="12" fill="#22d3ee" fill-opacity=".09" stroke="#22d3ee" stroke-width="1.6"/><rect x="275" y="175" width="210" height="70" rx="12" fill="#0f172a"/><rect x="275" y="175" width="210" height="70" rx="12" fill="#a78bfa" fill-opacity=".09" stroke="#a78bfa" stroke-width="1.6"/><rect x="535" y="175" width="210" height="70" rx="12" fill="#0f172a"/><rect x="535" y="175" width="210" height="70" rx="12" fill="#34d399" fill-opacity=".09" stroke="#34d399" stroke-width="1.6"/><rect x="795" y="175" width="210" height="70" rx="12" fill="#0f172a"/><rect x="795" y="175" width="210" height="70" rx="12" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24" stroke-width="1.6"/><rect x="1055" y="175" width="210" height="70" rx="12" fill="#0f172a"/><rect x="1055" y="175" width="210" height="70" rx="12" fill="#60a5fa" fill-opacity=".09" stroke="#60a5fa" stroke-width="1.6"/><rect x="1315" y="175" width="210" height="70" rx="12" fill="#0f172a"/><rect x="1315" y="175" width="210" height="70" rx="12" fill="#a78bfa" fill-opacity=".09" stroke="#a78bfa" stroke-width="1.6"/><rect x="1575" y="175" width="210" height="70" rx="12" fill="#0f172a"/><rect x="1575" y="175" width="210" height="70" rx="12" fill="#94a3b8" fill-opacity=".09" stroke="#94a3b8" stroke-width="1.6"/><rect x="375" y="295" width="10" height="200" fill="#0f172a" stroke="#a78bfa"/><rect x="895" y="590" width="10" height="590" fill="#0f172a" stroke="#fbbf24"/><rect x="1155" y="785" width="10" height="295" fill="#0f172a" stroke="#60a5fa"/><rect x="1415" y="1180" width="10" height="160" fill="#0f172a" stroke="#a78bfa"/><rect x="285" y="320" width="460" height="125" rx="14" fill="none" stroke="#34d399" stroke-opacity=".5" stroke-dasharray="8 6"/><rect x="540" y="1225" width="990" height="135" rx="14" fill="none" stroke="#34d399" stroke-opacity=".5" stroke-dasharray="8 6"/><rect x="40" y="710" width="630" height="140" rx="12" fill="#0f172a"/><rect x="40" y="710" width="630" height="140" rx="12" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24" stroke-width="1.6"/><rect x="55" y="1560" width="1690" height="95" rx="12" fill="#0f172a"/><rect x="55" y="1560" width="1690" height="95" rx="12" fill="#fb7185" fill-opacity=".09" stroke="#fb7185" stroke-width="1.6"/><text x="35" y="211" font-size="25" fill="#22d3ee" text-anchor="start" font-weight="650">客户端 / HTTP</text><text x="295" y="211" font-size="25" fill="#a78bfa" text-anchor="start" font-weight="650">提交用例</text><text x="555" y="211" font-size="25" fill="#34d399" text-anchor="start" font-weight="650">业务数据库</text><text x="815" y="211" font-size="25" fill="#fbbf24" text-anchor="start" font-weight="650">Runner / 协调器</text><text x="1075" y="211" font-size="25" fill="#60a5fa" text-anchor="start" font-weight="650">Agent 或 CI</text><text x="1335" y="211" font-size="25" fill="#a78bfa" text-anchor="start" font-weight="650">发布用例</text><text x="1595" y="211" font-size="25" fill="#94a3b8" text-anchor="start" font-weight="650">SDK 恢复库</text><text x="301" y="348" font-size="19" fill="#34d399" text-anchor="start" font-weight="400">T1 · 同一个业务事务</text><text x="250.0" y="281" font-size="21" fill="#22d3ee" text-anchor="middle" font-weight="400">1. 输入 + 请求键</text><text x="510.0" y="386" font-size="21" fill="#34d399" text-anchor="middle" font-weight="400">2. Message + Run + 关联</text><text x="250.0" y="481" font-size="21" fill="#94a3b8" text-anchor="middle" font-weight="400">3. 返回已接受</text><text x="770.0" y="576" font-size="21" fill="#fbbf24" text-anchor="middle" font-weight="400">4. 扫描 / 授权 / 领取</text><text x="1290.0" y="671" font-size="21" fill="#fb7185" text-anchor="middle" font-weight="400">5. 当前：所有策略先查询 SDK 存档</text><text x="1030.0" y="771" font-size="21" fill="#60a5fa" text-anchor="middle" font-weight="400">6. 选择策略并启动</text><text x="1420.0" y="866" font-size="21" fill="#60a5fa" text-anchor="middle" font-weight="400">7. 普通聊天：执行图与 checkpoint</text><text x="900.0" y="966" font-size="21" fill="#34d399" text-anchor="middle" font-weight="400">8. hooks 保存实际动作、用量和进度</text><text x="1030.0" y="1066" font-size="21" fill="#60a5fa" text-anchor="middle" font-weight="400">9. 返回候选结果</text><text x="1160.0" y="1166" font-size="21" fill="#a78bfa" text-anchor="middle" font-weight="400">10. store.persist → 注入的 PublishRun</text><text x="556" y="1253" font-size="19" fill="#34d399" text-anchor="start" font-weight="400">T2 · 授权复核 + 稳定结果 + 正式消息 + 终态 + 释放位置</text><text x="1030.0" y="1296" font-size="21" fill="#34d399" text-anchor="middle" font-weight="400">11. 同一 Session 原子保存；失败整体回滚</text><text x="380.0" y="1416" font-size="21" fill="#22d3ee" text-anchor="middle" font-weight="400">12. history / SSE 读取已提交快照</text><text x="380.0" y="1501" font-size="21" fill="#94a3b8" text-anchor="middle" font-weight="400">13. 展示持久化状态与结果</text><text x="60" y="746" font-size="25" fill="#fbbf24" text-anchor="start" font-weight="650">并行看护与停止</text><text x="60" y="780" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">协调器 watcher 检查取消、撤权、超时并定期保存。</text><text x="60" y="809" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">取消请求先写业务库；断开 SSE 不会自动取消 Run。</text><text x="75" y="1596" font-size="25" fill="#fb7185" text-anchor="start" font-weight="650">边界与风险</text><text x="75" y="1630" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">模型 / MCP 等待不占业务事务；第 5 步越过了策略边界，使不使用此 SDK 的 CI 也受存档损坏影响。</text><text x="50" y="65" font-size="36" fill="#e2e8f0" text-anchor="start" font-weight="700">运行时调度｜一次输入怎样成为已发布结果</text><text x="50" y="108" font-size="22" fill="#94a3b8" text-anchor="start" font-weight="400">时间向下；实线为调用或写入，虚线为返回。HTTP 提交、后台执行、结果发布和只读观察分开。</text><text x="1750" y="1675" font-size="17" fill="#94a3b8" text-anchor="end" font-weight="400">NIUMACREW · CURRENT · RUNTIME · 2026-10-26</text></svg>