<text x="200" y="215" text-anchor="middle" font-size="21" class="title">浏览器登录与请求</text>
<text x="200" y="249" text-anchor="middle" font-size="15" class="muted">API Cookie 适配</text>
<text x="200" y="278" text-anchor="middle" font-size="15" class="">密码 / GitHub / 游客</text>
<rect x="480" y="180" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="480" y="180" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="640" y="215" text-anchor="middle" font-size="21" class="title">身份服务</text>
<text x="640" y="249" text-anchor="middle" font-size="15" class="muted">service.py</text>
<text x="640" y="278" text-anchor="middle" font-size="15" class="">验证身份，签发与解析会话</text>
<rect x="920" y="180" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="920" y="180" width="320" height="170" rx="10" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.6"/>
<text x="1080" y="215" text-anchor="middle" font-size="21" class="title">用户与会话记录</text>
<text x="1080" y="249" text-anchor="middle" font-size="15" class="muted">models.py</text>
<text x="1080" y="278" text-anchor="middle" font-size="15" class="">长期归属与短期访问分开</text>
<rect x="40" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="40" y="560" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="200" y="595" text-anchor="middle" font-size="21" class="title">GitHub 身份验证</text>
<text x="200" y="629" text-anchor="middle" font-size="15" class="muted">github.py</text>
<text x="200" y="658" text-anchor="middle" font-size="15" class="">校验回调，取得稳定外部 ID</text>
<rect x="480" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="480" y="560" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="640" y="595" text-anchor="middle" font-size="21" class="title">可信当前主体</text>
<text x="640" y="629" text-anchor="middle" font-size="15" class="muted">actor.py</text>
<text x="640" y="658" text-anchor="middle" font-size="15" class="">用户、角色与会话依据</text>
<rect x="920" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="920" y="560" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="1080" y="595" text-anchor="middle" font-size="21" class="title">操作和范围检查</text>
<text x="1080" y="629" text-anchor="middle" font-size="15" class="muted">permissions.py + 业务所有者</text>
<text x="1080" y="658" text-anchor="middle" font-size="15" class="">角色能力 + 当前资源归属</text>
<rect x="385.0" y="233" width="70" height="24" rx="3" fill="#0f172a"/>
<text x="420.0" y="250" text-anchor="middle" font-size="14" class="label">请求凭证</text>
<rect x="818.0" y="233" width="84" height="24" rx="3" fill="#0f172a"/>
<text x="860.0" y="250" text-anchor="middle" font-size="14" class="label">短事务维护</text>
<rect x="385.0" y="356" width="70" height="24" rx="3" fill="#0f172a"/>
<text x="420.0" y="373" text-anchor="middle" font-size="14" class="label">外部身份</text>
<rect x="655" y="428.0" width="103.04" height="24" rx="3" fill="#0f172a"/>
<text x="662" y="445.0" text-anchor="start" font-size="14" class="label">解析为 Actor</text>
<rect x="804.0" y="613" width="112" height="24" rx="3" fill="#0f172a"/>
<text x="860.0" y="630" text-anchor="middle" font-size="14" class="label">业务及后台检查</text>
<text x="40" y="52" text-anchor="start" font-size="26" class="title">身份、会话与访问控制：内部结构与协作</text>
<text x="40" y="88" font-size="16" class="muted">节点对应实际实现；箭头标明调用或数据交付，具体事务和授权边界见正文。</text>
<text x="40" y="875" font-size="15" class="muted">当前实现的模块协作图；目录结构和图中职责不表示已经独立部署为多个服务。</text>
</svg>