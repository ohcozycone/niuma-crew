<text x="640" y="629" text-anchor="middle" font-size="15" class="muted">usage.py / errors.py</text>
<text x="640" y="658" text-anchor="middle" font-size="15" class="">真实累计或未知，保留故障含义</text>
<rect x="920" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="920" y="560" width="320" height="170" rx="10" fill="#fb923c" fill-opacity="0.08" stroke="#fb923c" stroke-width="1.6"/>
