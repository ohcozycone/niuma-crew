<text x="190.0" y="802" text-anchor="middle" font-size="20" font-weight="600">使用者 User</text>
<text class="sub" x="190.0" y="829" text-anchor="middle" font-size="15">登录身份，不是数字员工</text>
<text x="190.0" y="854" text-anchor="middle" font-size="15">一份许可可供不同人各自绑定</text>
<text x="870" y="178" text-anchor="middle" font-size="14">引用大脑</text>
