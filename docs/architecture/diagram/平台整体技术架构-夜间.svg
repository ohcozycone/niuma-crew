<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1236" role="img" aria-labelledby="title desc">
<title id="title">NiumaCrew 平台技术架构</title>
<desc id="desc">按模块职责展示接入、业务应用、受控执行和平台支撑服务，数据存储与运行服务另列为运行依赖。虚线框表示待建设或待接入，包括微信及其他IM、事件接入、任务管理与编排、长期记忆。业务应用内部进行身份与权限校验、业务准入和幂等检查。计划调度归任务管理。两条圆弧连接整层外框，分别表示应用提交或取消Run，以及执行成果回到所属应用。图表示模块职责与执行协作，不表示独立部署或严格源码依赖。</desc>
<metadata>配色来源：frontend/src/design-system/theme.css。主图随宿主颜色模式适配；夜间导出版固定为夜间配色。</metadata>
<defs>
<marker id="request-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" class="request-head"/></marker>
<marker id="result-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" class="result-head"/></marker>
<style>
text{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
.title{font-size:32px;font-weight:600;letter-spacing:-.5px}
.section{font-size:22px;font-weight:600}
.name{font-size:20px;font-weight:600}
.small-name{font-size:18px;font-weight:600}
.body{font-size:16px}
.caption{font-size:14px}
.english{font-size:13px;letter-spacing:.15px}

.region{stroke-width:1.2}
.card{stroke-width:1.2}
.planned{stroke-dasharray:5 5}
.request{fill:none;stroke-width:1.5;stroke-linecap:butt;marker-end:url(#request-arrow)}
.result{fill:none;stroke-width:1.5;stroke-linecap:butt;marker-end:url(#result-arrow)}

.canvas{fill:#1b1a18}
text{fill:#f2eee5}
.body,.caption,.english{fill:#b9b4a8}
.brand{fill:#eea379}
.region{fill:#242321;stroke:#464239}
.card{fill:#2a2824;stroke:#464239}
.planned{stroke:#b9b4a8}
.request{stroke:#eea379}
.result{stroke:#b9b4a8}
.request-head{fill:#eea379}
.result-head{fill:#b9b4a8}

</style></defs>
