<text x="40" y="62" font-size="35" font-weight="700" fill="#eaf1fa" text-anchor="start">前端分层｜围绕页面、交互和状态组织</text>
<text x="40" y="103" font-size="19" font-weight="400" fill="#b6c6da" text-anchor="start">Hook 面向组件使用方式，API 面向稳定操作；两者都不要求与后端实体或文件一一对应。</text>
<text x="1760" y="140" font-size="16" font-weight="400" fill="#a2b4cd" text-anchor="end">02 / 04  ·  当前实施 / 职责边界  ·  2026-10-27</text>
<text x="64" y="204" font-size="24" font-weight="650" fill="#48c7ed" text-anchor="start">01  页面入口｜用户在哪个工作界面</text>
<text x="64" y="234" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">路由、Layout 与页面负责界面组合；下面保留当前产品名称。</text>
<text x="82" y="284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">对话</text>
<text x="82" y="307" font-size="15" font-weight="400" fill="#48c7ed" text-anchor="start">pages/conversations</text>
<text x="82" y="332" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">输入、回复、过程、历史</text>
<text x="393" y="284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">员工与方法</text>
<text x="393" y="307" font-size="15" font-weight="400" fill="#48c7ed" text-anchor="start">pages/agents · skills</text>
<text x="393" y="332" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">资源管理与工作入口</text>
<text x="704" y="284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">模型与资料</text>
<text x="704" y="307" font-size="15" font-weight="400" fill="#48c7ed" text-anchor="start">pages/brains · knowledge</text>
<text x="704" y="332" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">模型连接、规则与资料</text>
<text x="1015" y="284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">登录及辅助页面</text>
<text x="1015" y="307" font-size="15" font-weight="400" fill="#48c7ed" text-anchor="start">signin · help · avatars</text>
<text x="1015" y="332" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">另含 design-system 展示</text>
<text x="64" y="449" font-size="24" font-weight="650" fill="#48c7ed" text-anchor="start">02  页面功能｜按用户交互拆分</text>
<text x="64" y="479" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">一个功能可以组合消息、执行状态、员工摘要和报告等多种后端数据。</text>
<text x="82" y="529" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">对话交互</text>
<text x="82" y="558" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">输入与提交、停止与重试</text>
<text x="82" y="585" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">回复正文、生成过程和错误</text>
<text x="82" y="612" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">历史窗口、问题目录与定位</text>
<text x="496" y="529" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">配置编辑</text>
<text x="496" y="558" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">表单字段与方法选择</text>
<text x="496" y="585" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">草稿、修订冲突与导航保护</text>
<text x="496" y="612" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">资源摘要及保存反馈</text>
<text x="910" y="529" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">身份与导航</text>
<text x="910" y="558" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">登录、退出与角色展示</text>
<text x="910" y="585" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">页面切换、来源返回</text>
<text x="910" y="612" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">主题选择与帮助入口</text>
<text x="64" y="759" font-size="24" font-weight="650" fill="#b99bfa" text-anchor="start">03  页面接入与状态｜Hook、控制器、局部仓库</text>
<text x="64" y="789" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">按真实复用和生命周期决定拆分；停止操作仍须准确指向那次处理。</text>
<text x="82" y="839" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">命令与网络协调</text>
<text x="82" y="868" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">提交、重试、停止和待确认恢复</text>
<text x="82" y="895" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">切换页面后的请求取消与失效保护</text>
<text x="82" y="922" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">useConversationController 等</text>
<text x="496" y="839" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">组件读取 Hook</text>
<text x="496" y="868" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">useConversation 读取页面所需内容</text>
<text x="496" y="895" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">回复可组合正文、状态和操作</text>
<text x="496" y="922" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">useMessage 读取这一行及操作</text>
<text x="910" y="839" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">局部状态与观察</text>
<text x="910" y="868" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">Provider / store / reducer 分工</text>
<text x="910" y="895" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">历史窗口与稳定对象快照</text>
<text x="910" y="922" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">同一处理只维护必要的单条订阅</text>
<text x="64" y="1069" font-size="24" font-weight="650" fill="#63d5b2" text-anchor="start">04  数据访问｜对接 HTTP 契约</text>
<text x="64" y="1099" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">页面使用场景接口；内部再映射字段和组合请求，不泄露数据库结构。</text>
<text x="82" y="1149" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">HTTP 客户端 · lib/api</text>
<text x="82" y="1178" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">请求、响应类型与错误解析</text>
<text x="82" y="1205" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">对话、配置、身份等场景操作</text>
<text x="496" y="1149" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">可注入 transport</text>
<text x="496" y="1178" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">为页面提供需要的网络能力</text>
<text x="496" y="1205" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">测试替身与真实连接使用同一边界</text>
<text x="910" y="1149" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">持续更新接入</text>
<text x="910" y="1178" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">SSE、版本去重、只读重连</text>
<text x="910" y="1205" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">订阅不是启动或取消处理的命令</text>
<text x="64" y="1329" font-size="24" font-weight="650" fill="#a2b4cd" text-anchor="start">共享界面依赖｜可被多个上层使用</text>
<text x="64" y="1359" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">这是复用区域，不表示 HTTP 客户端需要依次调用下面的组件。</text>
<text x="82" y="1409" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">基础控件与通用展示</text>
<text x="82" y="1438" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">components/ui · common</text>
<text x="393" y="1409" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">业务复用组件</text>
<text x="393" y="1438" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">员工、方法、身份与配置表单</text>
<text x="704" y="1409" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">设计系统</text>
<text x="704" y="1438" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">主题令牌、样式与交互约定</text>
<text x="1015" y="1409" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">头像与品牌</text>
<text x="1015" y="1438" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">成品资源、清单与构建脚本</text>
<text x="1364" y="204" font-size="24" font-weight="650" fill="#f29cae" text-anchor="start">共享身份状态</text>
<text x="1364" y="234" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">跨页面存在；由后端确认身份与权限。</text>
<text x="1382" y="284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">state/auth</text>
<text x="1382" y="313" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">保存当前身份和作用域</text>
<text x="1382" y="340" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">身份变化时清理旧请求与观察</text>
<text x="1382" y="367" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">前端按钮可见性不替代权限检查</text>
<text x="1382" y="394" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">不持有对话正文或执行调度规则</text>
<text x="1364" y="564" font-size="24" font-weight="650" fill="#b99bfa" text-anchor="start">共享编辑状态</text>
<text x="1364" y="594" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">页面持有资源；外壳管理离开保护。</text>
<text x="1382" y="644" font-size="19.637638807714787" font-weight="600" fill="#f2f6fc" text-anchor="start">state/configuration · editing</text>
<text x="1382" y="673" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">配置只通知更新；草稿留页面</text>
<text x="1382" y="700" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">编辑区注册放弃回调与保存锁</text>
<text x="1382" y="727" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">useDraft / useQueryState 等辅助</text>
<text x="1382" y="754" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">不接管对话提交与流式订阅</text>
<text x="1364" y="924" font-size="24" font-weight="650" fill="#f3c567" text-anchor="start">主题、外壳与通用能力</text>
<text x="1364" y="954" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">作为共享依赖使用，不形成业务实体。</text>
<text x="1382" y="1004" font-size="21.903520208604956" font-weight="600" fill="#f2f6fc" text-anchor="start">state/theme · router · lib</text>
<text x="1382" y="1033" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">主题初始化与持久选择</text>
<text x="1382" y="1060" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">Layout、返回路径和页面懒加载</text>
<text x="1382" y="1087" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">通用格式与浏览器工具</text>
<text x="1382" y="1114" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">共享组件不导入页面私有状态</text>
<text x="1364" y="1284" font-size="24" font-weight="650" fill="#63d5b2" text-anchor="start">前后端必须对齐的含义</text>
<text x="1364" y="1314" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">结构与命名可以不同，行为不能歧义。</text>
<text x="1382" y="1364" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">稳定标识与操作约定</text>
<text x="1382" y="1393" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">状态、ID、分页、错误及权限范围</text>
<text x="1382" y="1420" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">取消和重试准确指向指定处理</text>
<text x="40" y="1537" font-size="17" font-weight="400" fill="#b6c6da" text-anchor="start">Hook 的边界取决于组件交互；API 的边界取决于稳定用户操作；后端模块的边界取决于数据与规则所有权。</text>
<text x="40" y="1567" font-size="17" font-weight="400" fill="#a2b4cd" text-anchor="start">不强制 useTurn、不强制改 /api/threads；现有请求保护、历史定位和单订阅行为需要保留。</text>
<text x="1760" y="1598" font-size="13" font-weight="400" fill="#7b91ad" text-anchor="end">NIUMACREW · LAYERED ARCHITECTURE</text>
</svg>
