<path class="call" d="M1080 922H1320"/>
<text class="label" x="1200.0" y="911" text-anchor="middle">调用模型或获准工具</text>
<path class="return" d="M1320 958H1080"/>
<text class="label" x="1200.0" y="947" text-anchor="middle">片段 / 工具结果</text>
<path class="call" d="M1080 994H840"/>
