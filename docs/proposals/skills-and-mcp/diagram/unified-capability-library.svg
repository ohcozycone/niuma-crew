<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1080" role="img" aria-labelledby="title desc">
<title id="title">统一技能库：官方接入与平台管理边界，拟议方案</title>
<desc id="desc">平台提供目录、标准包管理、加密连接和员工许可，运行时复用官方 MCPAdapter、MCPConfig、SkillsMiddleware 与文件和沙箱接口。只增加一个轻量 MCP 接入分组，不另建配置协议或 Skill 激活状态机。</desc>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#94a3b8"/></marker>
</defs>
<style>
text{font-family:'PingFang SC','Noto Sans SC',sans-serif;fill:#f1f5f9;font-size:16px}.title{font-size:24px;font-weight:600}.heading{font-size:18px;font-weight:600}.small{font-size:14px;fill:#bdcadd}.muted{font-size:14px;fill:#94a3b8}.ui{fill:#083344;fill-opacity:.65;stroke:#22d3ee;stroke-width:1.4}.platform{fill:#4c1d95;fill-opacity:.35;stroke:#a78bfa;stroke-width:1.4}.official{fill:#064e3b;fill-opacity:.5;stroke:#34d399;stroke-width:1.4}.run{fill:#78350f;fill-opacity:.35;stroke:#fbbf24;stroke-width:1.4}.edge{fill:none;stroke:#94a3b8;stroke-width:1.5;marker-end:url(#arrow)}
</style>
<rect width="1180" height="1080" fill="#0f172a"/><rect width="1180" height="1080" fill="url(#grid)"/>
<text x="34" y="43" class="title">统一技能库：官方负责接入，平台负责管理与授权</text>
<text x="34" y="73" class="small">保留技能库、内置工具、Key 与员工装配；复用标准内容和官方运行机制。</text>
<g class="edge"><path d="M214 205V279"/><path d="M590 205V279"/><path d="M966 205V279"/><path d="M214 440V505H590V539"/><path d="M590 440V539"/><path d="M966 440V505H590"/><path d="M590 625V649H214V709"/><path d="M590 625V709"/><path d="M590 649H966V709"/><path d="M214 888V941"/><path d="M590 888V941"/><path d="M966 888V941"/></g>
<g><rect x="34" y="112" width="360" height="93" rx="10" class="ui"/><rect x="410" y="112" width="360" height="93" rx="10" class="ui"/><rect x="786" y="112" width="360" height="93" rx="10" class="ui"/></g>
<g text-anchor="middle"><text x="214" y="147" class="heading">技能库与标准 Skill 编辑</text><text x="214" y="178" class="small">Skill / 内置 / MCP · 创建与导入</text><text x="590" y="147" class="heading">MCP 配置与账号连接</text><text x="590" y="178" class="small">官方 JSON / 配置预设 · Key 单独保存</text><text x="966" y="147" class="heading">员工能力装配</text><text x="966" y="178" class="small">Skill + 账号工具 + 范围 + 暴露方式</text></g>
<rect x="20" y="236" width="1140" height="237" rx="12" fill="none" stroke="#a78bfa" stroke-dasharray="7 4"/>
<text x="34" y="262" class="heading" style="fill:#c4b5fd">平台补充 · 目录只是只读联合投影，写入仍各归其主</text>
<g><rect x="34" y="280" width="360" height="160" rx="10" class="platform"/><rect x="410" y="280" width="360" height="160" rx="10" class="platform"/><rect x="786" y="280" width="360" height="160" rx="10" class="platform"/></g>
<g text-anchor="middle"><text x="214" y="314" class="heading">skills</text><text x="214" y="346">标准包保存 / 导入导出 / 修订</text><text x="214" y="377" class="small">显示名、参数与包资源引用</text><text x="214" y="408" class="small">不保存 Key，不执行导入脚本</text><text x="590" y="314" class="heading">tools</text><text x="590" y="346">轻量接入分组 / 加密账号连接</text><text x="590" y="377" class="small">每账号目录与批准 / 网络和秘密边界</text><text x="590" y="408" class="small">复用现有连接，不建模板和定义体系</text><text x="966" y="314" class="heading">agents</text><text x="966" y="346">员工许可 / 别名 / 直接或按需</text><text x="966" y="377" class="small">共享与专用范围，装配原子保存</text><text x="966" y="408" class="small">不解析 MCP，不在事务里请求网络</text></g>
<rect x="34" y="540" width="1112" height="85" rx="10" class="run"/>
<text x="590" y="572" text-anchor="middle" class="heading">复用当前运行底座：conversations → execution → agent_runtime</text><text x="590" y="600" text-anchor="middle" class="small">冻结内容与许可 / 授权和预算 / 取消与审计 · resolver 仅解析本轮已获准绑定</text>
<rect x="20" y="670" width="1140" height="240" rx="12" fill="none" stroke="#34d399" stroke-dasharray="7 4"/>
<text x="34" y="697" class="heading" style="fill:#6ee7b7">直接复用官方 · 不再实现第二套接入、配置或 Skill 加载机制</text>
<g><rect x="34" y="710" width="360" height="178" rx="10" class="official"/><rect x="410" y="710" width="360" height="178" rx="10" class="official"/><rect x="786" y="710" width="360" height="178" rx="10" class="official"/></g>
<g text-anchor="middle"><text x="214" y="745" class="heading">LangChain + FastMCP</text><text x="214" y="777">MCPConfig + MCPAdapter</text><text x="214" y="808" class="small">官方配置解析、发现、工具转换</text><text x="214" y="839" class="small">保留平台受控传输与逐账号证据</text><text x="214" y="868" class="muted">当前平台开放 HTTP；其他方式另接线</text><text x="590" y="745" class="heading">Deep Agents Skills</text><text x="590" y="777">标准 SKILL.md + SkillsMiddleware</text><text x="590" y="808" class="small">摘要 / 读取 / pin / include_tools</text><text x="590" y="839" class="small">官方控制可见性，平台 resolver 查许可</text><text x="590" y="868" class="muted">读取成功的审计不等于永久开放</text><text x="966" y="745" class="heading">Deep Agents Backends</text><text x="966" y="777">文件中间件 / Sandbox 接口</text><text x="966" y="808" class="small">复用现有文件和 OpenSandbox 适配</text><text x="966" y="839" class="small">八项内置可见，实际使用仍需授权</text><text x="966" y="868" class="muted">一个 read_file，一份工作副本</text></g>
<rect x="34" y="942" width="1112" height="86" rx="10" class="run"/>
<text x="590" y="975" text-anchor="middle" class="heading">实际调用继续经过 tools / files / sandboxes 的宿主检查与生命周期</text><text x="590" y="1004" text-anchor="middle" class="small">Key 仅在 tools 调用侧解密；Skill、模型、快照、公开目录不接收秘密。</text>
<text x="34" y="1055" class="muted">拟议改造 · 新增一张 MCP 分组表，其余优先扩展既有对象 · 2026-10-27</text>
</svg>
