<path class="call" d="M840 1030H600"/>
<text class="label" x="720.0" y="1019" text-anchor="middle">保存动作、用量与进度</text>
<rect class="note" x="770" y="1048" width="600" height="28" rx="6"/>
<text class="caption" x="1070.0" y="1068" text-anchor="middle">SDK 检查点独立持久化，不代替业务历史</text>
<rect class="phase" x="56" y="1110" width="1328" height="34" rx="7"/>
<text class="section brand" x="72" y="1134">04 保存成果与业务接纳</text>
<text class="caption" x="1368" y="1134" text-anchor="end">执行侧收尾与核验；成果和终态同事务保存</text>
<path class="return" d="M1080 1178H840"/>
