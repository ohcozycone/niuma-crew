[project]
name = "backend"
version = "0.1.0"
description = "Digital agent platform backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "cryptography>=45,<48",
    "deepagents==0.7.30",
    "fastapi>=0.143.1,<1",
    "httpx>=0.28,<1",
    "httpx2==2.13.1",
    "jsonschema>=4.26,<5",
    "langchain[mcp]==1.4.7",
    "langchain-core>=1.6.10",
    "jieba>=0.42,<1",
    "langchain-text-splitters>=1,<2",
    "langchain-openai>=1.7.2",
    "langgraph-checkpoint-sqlite==3.1.2",
    "pwdlib[argon2]>=0.3,<1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
    "opensandbox==1.1.1",
    "langchain-sandbox-opensandbox==0.1.2",
    "chromadb>=1.5.9,<2",
    "langchain-classic>=1.0.8,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.18,<2",
    "pytest>=9.1.1",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
explicit_package_bases = true
python_version = "3.12"
files = ["app/infrastructure/database/errors.py", "app/execution/contracts.py", "app/skills/contracts.py", "app/skills/definitions.py", "app/execution/snapshot.py", "app/execution/prompts.py", "app/conversations/acceptance.py", "app/execution/service.py", "app/execution/runtime/task.py", "app/execution/runtime/worker.py", "app/execution/assembly.py", "app/execution/store.py", "app/conversations/queries.py", "app/conversations/writes.py", "app/conversations/service.py", "app/capability_catalog/queries.py", "app/knowledge"]
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
