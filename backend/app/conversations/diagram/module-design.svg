<rect x="40" y="180" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="40" y="180" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="200" y="215" text-anchor="middle" font-size="21" class="title">发送 / 重试 / 停止</text>
<text x="200" y="249" text-anchor="middle" font-size="15" class="muted">service.py</text>
<text x="200" y="278" text-anchor="middle" font-size="15" class="">校验请求与对话归属</text>
<rect x="480" y="180" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="480" y="180" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="640" y="215" text-anchor="middle" font-size="21" class="title">输入准备与消息写入</text>
<text x="640" y="249" text-anchor="middle" font-size="15" class="muted">preparation.py / writes.py</text>
<text x="640" y="278" text-anchor="middle" font-size="15" class="">固定配置，建立输入和空回复</text>
<rect x="920" y="180" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="920" y="180" width="320" height="170" rx="10" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.6"/>
<text x="1080" y="215" text-anchor="middle" font-size="21" class="title">消息与运行关联</text>
<text x="1080" y="249" text-anchor="middle" font-size="15" class="muted">models.py + execution 准入</text>
<text x="1080" y="278" text-anchor="middle" font-size="15" class="">共同提交，返回稳定回复 ID</text>
<rect x="40" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="40" y="560" width="320" height="170" rx="10" fill="#fb923c" fill-opacity="0.08" stroke="#fb923c" stroke-width="1.6"/>
<text x="200" y="595" text-anchor="middle" font-size="21" class="title">后台执行宿主</text>
<text x="200" y="629" text-anchor="middle" font-size="15" class="muted">execution / bootstrap 回调</text>
<text x="200" y="658" text-anchor="middle" font-size="15" class="">领取运行，调用准备与授权</text>
<rect x="480" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="480" y="560" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="640" y="595" text-anchor="middle" font-size="21" class="title">候选结果发布</text>
<text x="640" y="629" text-anchor="middle" font-size="15" class="muted">publication.py</text>
<text x="640" y="658" text-anchor="middle" font-size="15" class="">复核许可、取消和文件，提交终态</text>
<rect x="920" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="920" y="560" width="320" height="170" rx="10" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-width="1.6"/>
