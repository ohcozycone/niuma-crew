<style>text{font-family:'PingFang SC','Noto Sans SC',sans-serif;fill:#e2e8f0;font-size:17px}.title{font-size:34px;font-weight:650}.sub{fill:#94a3b8;font-size:18px}.name{font-weight:600;font-size:21px}.line{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}.life{stroke:#334155;stroke-dasharray:7 6;stroke-width:2}.return{stroke-dasharray:7 4}.note{fill:#cbd5e1;font-size:18px}</style>
</defs>
<rect width="1600" height="1260" fill="#0f172a"/>
