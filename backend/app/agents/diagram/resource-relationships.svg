<text x="410" y="807" text-anchor="middle" font-size="14">本人选择</text>
<text x="1050" y="752" text-anchor="middle" font-size="14">同服务、相容操作定义</text>
<text x="640" y="945" text-anchor="middle" font-size="16">关系归 agents；技能、模型与工具账号归各资源模块。执行快照捕获内容，当前许可检查决定能否继续。</text>
