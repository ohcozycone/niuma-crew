<text x="40" y="62" font-size="35" font-weight="700" fill="#eaf1fa" text-anchor="start">后端分层｜业务协作、数据所有者与运行支撑</text>
<text x="40" y="103" font-size="19" font-weight="400" fill="#b6c6da" text-anchor="start">请求 service 可在 API；共享流程归业务模块；execution 只接受注入的运行协作能力。</text>
<text x="1760" y="140" font-size="16" font-weight="400" fill="#a2b4cd" text-anchor="end">03 / 04  ·  当前实施 / 职责边界  ·  2026-10-27</text>
<text x="64" y="204" font-size="24" font-weight="650" fill="#48c7ed" text-anchor="start">01  HTTP 适配 · api</text>
<text x="64" y="234" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">解析请求、响应与身份；接口围绕客户端业务操作组织。</text>
<text x="82" y="284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">对话与诊断入口</text>
<text x="82" y="313" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">发送、读取、停止、报告与反馈</text>
<text x="393" y="284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">配置与资源入口</text>
<text x="393" y="313" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">员工、方法、模型、规则与摘要</text>
<text x="704" y="284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">身份及公开入口</text>
<text x="704" y="313" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">登录、OAuth、公开数据与健康</text>
<text x="1015" y="284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">传输公共机制</text>
<text x="1015" y="313" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">来源校验、限流与错误转换</text>
<text x="64" y="444" font-size="24" font-weight="650" fill="#b99bfa" text-anchor="start">02  请求编排与共享流程 · 按所属模块组织</text>
<text x="64" y="474" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">此处是职责分区：请求服务归 API，三项共享流程归 conversations；不建 application/use_cases。</text>
<text x="82" y="524" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">接受与控制 · API</text>
<text x="82" y="547" font-size="15" font-weight="400" fill="#b99bfa" text-anchor="start">api/.../conversations/service.py</text>
<text x="82" y="572" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">创建对话、提交、重试和停止</text>
<text x="82" y="599" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">内容、执行记录与关联一起提交</text>
<text x="496" y="524" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">共享结果发布</text>
<text x="496" y="547" font-size="15" font-weight="400" fill="#b99bfa" text-anchor="start">conversations/publication.py</text>
<text x="496" y="572" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">调用业务发布器与执行收尾</text>
<text x="496" y="599" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">答复、终态和关联一起提交</text>
<text x="910" y="524" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">共享准备与授权</text>
<text x="910" y="553" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">preparation / authorization</text>
<text x="910" y="580" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">启动、动作、恢复与发布共用</text>
<text x="64" y="724" font-size="24" font-weight="650" fill="#63d5b2" text-anchor="start">03A  业务模块｜各自拥有数据与规则</text>
<text x="64" y="754" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">内部可含模型、读取和写入；不为每个对象新建一个模块。</text>
<text x="82" y="804" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">对话与消息</text>
<text x="82" y="827" font-size="15" font-weight="400" fill="#63d5b2" text-anchor="start">conversations</text>
<text x="82" y="852" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">内容、顺序、历史和处理关联</text>
<text x="483" y="804" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">数字员工</text>
<text x="483" y="827" font-size="15" font-weight="400" fill="#63d5b2" text-anchor="start">agents</text>
<text x="483" y="852" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">员工配置、装配与执行配置视图</text>
<text x="82" y="924" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">共享方法</text>
<text x="82" y="947" font-size="15" font-weight="400" fill="#63d5b2" text-anchor="start">skills</text>
<text x="82" y="972" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">方法定义、参数与资源规范</text>
<text x="483" y="924" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">模型连接</text>
<text x="483" y="947" font-size="15" font-weight="400" fill="#63d5b2" text-anchor="start">model_connections</text>
<text x="483" y="972" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">模型配置、凭证生命周期与修订</text>
<text x="82" y="1044" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">全员规则</text>
<text x="82" y="1067" font-size="15" font-weight="400" fill="#63d5b2" text-anchor="start">organization_rules</text>
<text x="82" y="1092" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">规则内容及版本化替换</text>
<text x="483" y="1044" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">专业诊断</text>
<text x="483" y="1067" font-size="15" font-weight="400" fill="#63d5b2" text-anchor="start">ci_diagnosis</text>
<text x="483" y="1092" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">目标、证据、报告校验和反馈</text>
<text x="924" y="724" font-size="24" font-weight="650" fill="#63d5b2" text-anchor="start">03B  执行支撑 · execution</text>
<text x="924" y="754" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">只用注入回调，不反向导入 API。</text>
<text x="942" y="804" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">执行数据与本地规则</text>
<text x="942" y="833" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">执行记录 Run、实际动作与用量</text>
<text x="942" y="860" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">状态转换、预算和进度存取</text>
<text x="942" y="887" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">正文与专业报告归业务模块</text>
<text x="942" y="984" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">准入与运行控制</text>
<text x="942" y="1013" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">幂等、容量与排队</text>
<text x="942" y="1040" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">调度、取消、超时、恢复与收尾</text>
<text x="942" y="1067" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">不创建聊天消息或解释诊断报告</text>
<text x="64" y="1204" font-size="24" font-weight="650" fill="#63d5b2" text-anchor="start">04  运行与协议实现｜由执行支撑调用具体实现</text>
<text x="64" y="1234" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">运行时获得冻结输入和受限能力；不反向读取业务 ORM 或决定业务发布。</text>
<text x="82" y="1284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">Agent 内部运行｜已独立</text>
<text x="82" y="1307" font-size="15" font-weight="400" fill="#63d5b2" text-anchor="start">agent_runtime</text>
<text x="82" y="1332" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">从 execution/sdk 等职责迁出</text>
<text x="82" y="1359" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">SDK 循环、流处理与恢复格式</text>
<text x="496" y="1284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">模型访问</text>
<text x="496" y="1307" font-size="15" font-weight="400" fill="#63d5b2" text-anchor="start">llm</text>
<text x="496" y="1332" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">模型工厂、网络资源与协议适配</text>
<text x="496" y="1359" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">错误分类与用量解析</text>
<text x="910" y="1284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">外部工具适配</text>
<text x="910" y="1307" font-size="15" font-weight="400" fill="#63d5b2" text-anchor="start">ci_diagnosis / MCP</text>
<text x="910" y="1332" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">当前 CI 取证与 MCP 接入</text>
<text x="910" y="1359" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">通用 tools 网关另列后续增量</text>
<text x="64" y="1484" font-size="24" font-weight="650" fill="#a2b4cd" text-anchor="start">技术设施｜数据库与公共技术机制</text>
<text x="64" y="1514" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">模块按需使用；表结构、事务工具和运行恢复有各自的维护入口。</text>
<text x="82" y="1564" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">infrastructure/database</text>
<text x="82" y="1593" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">连接、事务、字段、错误识别与注册</text>
<text x="496" y="1564" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">正式迁移与恢复存档</text>
<text x="496" y="1593" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">稳定业务数据与 SDK 状态分开</text>
<text x="910" y="1564" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">共享错误与技术机制</text>
<text x="910" y="1593" font-size="17" font-weight="400" fill="#bacbde" text-anchor="start">errors / schemas / 网络 / 加密</text>
<text x="1364" y="204" font-size="24" font-weight="650" fill="#f29cae" text-anchor="start">身份与权限所有者 · auth</text>
<text x="1364" y="234" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">是业务能力；被多个层的入口使用。</text>
<text x="1382" y="284" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">身份生命周期与访问规则</text>
<text x="1382" y="313" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">用户、外部身份、登录会话</text>
<text x="1382" y="340" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">Actor、角色能力与资源策略</text>
<text x="1382" y="367" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">运行期间仍需通过受限接口复核</text>
<text x="1382" y="394" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">规则不复制到执行器和前端</text>
<text x="1364" y="534" font-size="24" font-weight="650" fill="#f3c567" text-anchor="start">装配与进程生命周期</text>
<text x="1364" y="564" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">能认识具体实现，不拥有业务规则。</text>
<text x="1382" y="614" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">main / bootstrap / config</text>
<text x="1382" y="643" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">main 导出 ASGI 入口</text>
<text x="1382" y="670" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">bootstrap 创建并连接实际依赖</text>
<text x="1382" y="697" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">config 读取和组合配置</text>
<text x="1382" y="724" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">启动、关闭、进程锁和资源释放</text>
<text x="1382" y="751" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">frontend_delivery 负责静态交付</text>
<text x="1364" y="924" font-size="24" font-weight="650" fill="#b99bfa" text-anchor="start">跨模块协作约束</text>
<text x="1364" y="954" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">按完整操作组织；数据仍各自拥有。</text>
<text x="1382" y="1004" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">清楚的依赖方向</text>
<text x="1382" y="1033" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">请求或共享流程组合明确操作</text>
<text x="1382" y="1060" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">执行模块调用受限运行接口</text>
<text x="1382" y="1087" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">运行时不读取 auth 或对话表</text>
<text x="1382" y="1114" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">模型与工具等待在业务事务外</text>
<text x="1364" y="1264" font-size="24" font-weight="650" fill="#a2b4cd" text-anchor="start">记录归属｜不是新增调用层</text>
<text x="1364" y="1294" font-size="17" font-weight="400" fill="#aebfd4" text-anchor="start">实体写在所属模块内部，避免与模块混排。</text>
<text x="1382" y="1344" font-size="22" font-weight="600" fill="#f2f6fc" text-anchor="start">内容与处理分开记录</text>
<text x="1382" y="1373" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">Conversation / Message：对话模块</text>
<text x="1382" y="1400" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">Run / Action：执行模块</text>
<text x="1382" y="1427" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">请求服务建立关联并检查归属</text>
<text x="1382" y="1454" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">Message 不需要独立服务模块</text>
<text x="1382" y="1481" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">具体正文迁移见数据方案</text>
<text x="1382" y="1508" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">不增加同生命周期的两层执行</text>
<text x="1382" y="1535" font-size="18" font-weight="400" fill="#bacbde" text-anchor="start">读取组合不是新增领域实体</text>
<text x="40" y="1697" font-size="17" font-weight="400" fill="#b6c6da" text-anchor="start">请求服务组织请求事务；共享准备授权发布归对话；execution 管运行，后台不导入 API。</text>
<text x="40" y="1727" font-size="17" font-weight="400" fill="#a2b4cd" text-anchor="start">仍是模块化单体；图中区域不表示微服务、独立数据库或新增部署单元。</text>
<text x="1760" y="1758" font-size="13" font-weight="400" fill="#7b91ad" text-anchor="end">NIUMACREW · LAYERED ARCHITECTURE</text>
</svg>
