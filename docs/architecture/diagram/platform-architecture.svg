<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 970" role="img" aria-labelledby="title desc">
<title id="title">当前平台架构：页面、业务、执行与资源</title><desc id="desc">浏览器通过 API 操作业务。对话接受后由同进程宿主驱动 Agent，最终经业务发布；模型和工具位于外部，业务数据库、文件和 SDK 存档职责分开。</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="#94a3b8"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#e2e8f0} .muted{fill:#94a3b8} .line{fill:none;stroke:#94a3b8;stroke-width:1.7;marker-end:url(#arrow)}</style>
<rect width="1500" height="970" fill="#0f172a"/><rect width="1500" height="970" fill="url(#grid)"/>
<text x="40" y="48" font-size="26" font-weight="700">当前平台架构：页面、业务、执行与资源</text>
<text class="muted" x="40" y="80" font-size="16">当前实现 · 职责与数据协作图，箭头不代表逐文件导入关系</text>
<rect x="330" y="105" width="740" height="610" rx="16" fill="none" stroke="#fbbf24" stroke-dasharray="8 5"/>
<text x="345" y="125" font-size="14" style="fill:#fbbf24">同一 FastAPI 后端进程 · bootstrap 装配服务与回调</text>
<path class="line" d="M300 190H360"/>
<text x="330" y="175" font-size="14" text-anchor="middle">/api</text>
<path class="line" d="M610 190H680"/>
<text x="645" y="175" font-size="14" text-anchor="middle">业务操作</text>
<path class="line" d="M485 240V280H175V240" stroke-dasharray="6 4"/>
<text x="330" y="270" font-size="14" text-anchor="middle">已保存快照 / SSE</text>
<path class="line" d="M860 240V350"/>
<text x="930" y="300" font-size="14" text-anchor="middle">Run 持久化后领取</text>
<path class="line" d="M860 450V560"/>
<text x="930" y="510" font-size="14" text-anchor="middle">受控调用与看护</text>
<path class="line" d="M680 190H640V780"/>
<text x="580" y="320" font-size="14" text-anchor="middle">业务短事务</text>
<path class="line" d="M680 400H610V780"/>
<text x="553" y="705" font-size="14" text-anchor="middle">运行与动作</text>
<path class="line" d="M1040 610H1120"/>
<text x="1080" y="595" font-size="14" text-anchor="middle">请求</text>
<path class="line" d="M860 660V780"/>
<text x="910" y="735" font-size="14" text-anchor="middle">保存成果</text>
<path class="line" d="M1040 640H1080V735H1290V780"/>
<text x="1260" y="725" font-size="14" text-anchor="middle">SDK 恢复依据</text>
<rect x="50" y="140" width="250" height="100" rx="9" fill="#0f172a"/>
<rect x="50" y="140" width="250" height="100" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee" stroke-width="1.6"/>
<text x="175.0" y="170" text-anchor="middle" font-size="20" font-weight="600">浏览器前端</text>
<text class="muted" x="175.0" y="197" text-anchor="middle" font-size="15">React 页面、表单与导航</text>
<text class="muted" x="175.0" y="220" text-anchor="middle" font-size="15">草稿、历史、过程与下载</text>
<rect x="360" y="140" width="250" height="100" rx="9" fill="#0f172a"/>
<rect x="360" y="140" width="250" height="100" rx="9" fill="#22d3ee" fill-opacity="0.09" stroke="#22d3ee" stroke-width="1.6"/>
<text x="485.0" y="170" text-anchor="middle" font-size="20" font-weight="600">HTTP 接入</text>
<text class="muted" x="485.0" y="197" text-anchor="middle" font-size="15">身份、参数、传输与响应</text>
<text class="muted" x="485.0" y="220" text-anchor="middle" font-size="15">观察连接不启动模型</text>
<rect x="680" y="140" width="360" height="100" rx="9" fill="#0f172a"/>
<rect x="680" y="140" width="360" height="100" rx="9" fill="#34d399" fill-opacity="0.09" stroke="#34d399" stroke-width="1.6"/>
<text x="860.0" y="170" text-anchor="middle" font-size="20" font-weight="600">业务模块</text>
<text class="muted" x="860.0" y="197" text-anchor="middle" font-size="15">员工、技能、大脑、工具、规范、知识</text>
<text class="muted" x="860.0" y="220" text-anchor="middle" font-size="15">对话拥有输入准备和最终交付</text>
<rect x="680" y="350" width="360" height="100" rx="9" fill="#0f172a"/>
<rect x="680" y="350" width="360" height="100" rx="9" fill="#fb923c" fill-opacity="0.09" stroke="#fb923c" stroke-width="1.6"/>
<text x="860.0" y="380" text-anchor="middle" font-size="20" font-weight="600">执行宿主 execution</text>
<text class="muted" x="860.0" y="407" text-anchor="middle" font-size="15">排队、领取、预算、动作与取消</text>
<text class="muted" x="860.0" y="430" text-anchor="middle" font-size="15">通过回调请求业务准备和发布</text>
<rect x="680" y="560" width="360" height="100" rx="9" fill="#0f172a"/>
<rect x="680" y="560" width="360" height="100" rx="9" fill="#60a5fa" fill-opacity="0.09" stroke="#60a5fa" stroke-width="1.6"/>
<text x="860.0" y="590" text-anchor="middle" font-size="20" font-weight="600">Agent 循环 agent_runtime</text>
<text class="muted" x="860.0" y="617" text-anchor="middle" font-size="15">模型与工具往返、方法加载</text>
<text class="muted" x="860.0" y="640" text-anchor="middle" font-size="15">受限资源接口，返回候选结果</text>
<rect x="1120" y="560" width="330" height="100" rx="9" fill="#0f172a"/>
<rect x="1120" y="560" width="330" height="100" rx="9" fill="#94a3b8" fill-opacity="0.09" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1285.0" y="590" text-anchor="middle" font-size="20" font-weight="600">外部能力</text>
<text class="muted" x="1285.0" y="617" text-anchor="middle" font-size="15">模型服务、MCP、OpenSandbox</text>
<text class="muted" x="1285.0" y="640" text-anchor="middle" font-size="15">凭据、网络与主机分别配置</text>
<rect x="360" y="780" width="350" height="100" rx="9" fill="#0f172a"/>
<rect x="360" y="780" width="350" height="100" rx="9" fill="#a78bfa" fill-opacity="0.09" stroke="#a78bfa" stroke-width="1.6"/>
<text x="535.0" y="810" text-anchor="middle" font-size="20" font-weight="600">业务 SQLite</text>
<text class="muted" x="535.0" y="837" text-anchor="middle" font-size="15">用户、配置、消息、Run 与动作</text>
<text class="muted" x="535.0" y="860" text-anchor="middle" font-size="15">同步 SQLAlchemy / 短事务</text>
<rect x="770" y="780" width="270" height="100" rx="9" fill="#0f172a"/>
<rect x="770" y="780" width="270" height="100" rx="9" fill="#a78bfa" fill-opacity="0.09" stroke="#a78bfa" stroke-width="1.6"/>
<text x="905.0" y="810" text-anchor="middle" font-size="20" font-weight="600">持久文件与技能字节</text>
<text class="muted" x="905.0" y="837" text-anchor="middle" font-size="15">文件引用与实际内容分开核对</text>
<text class="muted" x="905.0" y="860" text-anchor="middle" font-size="15">正式交付后建立消息关联</text>
<rect x="1130" y="780" width="320" height="100" rx="9" fill="#0f172a"/>
<rect x="1130" y="780" width="320" height="100" rx="9" fill="#a78bfa" fill-opacity="0.09" stroke="#a78bfa" stroke-width="1.6"/>
<text x="1290.0" y="810" text-anchor="middle" font-size="20" font-weight="600">SDK 恢复存档</text>
<text class="muted" x="1290.0" y="837" text-anchor="middle" font-size="15">保存内部状态及继续位置</text>
<text class="muted" x="1290.0" y="860" text-anchor="middle" font-size="15">不作为正式对话历史来源</text>
<text class="muted" x="40" y="930" font-size="16">当前部署：同进程、同业务库、单持锁宿主。知识库接入文本与 BM25；向量/问答仍为独立实验。</text>
</svg>