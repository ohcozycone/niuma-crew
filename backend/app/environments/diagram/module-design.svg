<text x="420.0" y="250" text-anchor="middle" font-size="14" class="label">acquire</text>
<rect x="811.0" y="233" width="98" height="24" rx="3" fill="#0f172a"/>
<text x="860.0" y="250" text-anchor="middle" font-size="14" class="label">创建及初始化</text>
<rect x="591.0" y="356" width="98" height="24" rx="3" fill="#0f172a"/>
<text x="640.0" y="373" text-anchor="middle" font-size="14" class="label">运行专属环境</text>
<rect x="598.0" y="765" width="84" height="24" rx="3" fill="#0f172a"/>
<text x="640.0" y="782" text-anchor="middle" font-size="14" class="label">先保存成果</text>
<rect x="373.24" y="613" width="93.52" height="24" rx="3" fill="#0f172a"/>
<text x="420.0" y="630" text-anchor="middle" font-size="14" class="label">结束 / 取消</text>
<rect x="813.24" y="390" width="93.52" height="24" rx="3" fill="#0f172a"/>
<text x="860.0" y="407" text-anchor="middle" font-size="14" class="label">查询 / 销毁</text>
<text x="40" y="52" text-anchor="start" font-size="26" class="title">沙箱申请、执行环境与回收：内部结构与协作</text>
<text x="40" y="88" font-size="16" class="muted">节点对应实际实现；箭头标明调用或数据交付，具体事务和授权边界见正文。</text>
<text x="40" y="875" font-size="15" class="muted">当前实现的模块协作图；目录结构和图中职责不表示已经独立部署为多个服务。</text>
