<text x="200" y="629" text-anchor="middle" font-size="15" class="muted">agent_runtime</text>
<text x="200" y="658" text-anchor="middle" font-size="15" class="">宿主允许后请求模型</text>
<rect x="480" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="480" y="560" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
