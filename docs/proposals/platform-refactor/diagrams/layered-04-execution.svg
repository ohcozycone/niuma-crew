<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1750" role="img" aria-labelledby="title desc">
<title id="title">执行边界｜宿主管运行，Agent 管内部模型与工具循环</title>
<desc id="desc">execution 是模块；Run 是模块内的执行记录。Agent 不通过共享对象取得整个数据库或执行存储。 实线表示已有职责，虚线表示后续未实现能力；当前范围已实施。</desc>
