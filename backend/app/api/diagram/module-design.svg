<text x="200" y="278" text-anchor="middle" font-size="15" class="">字段、Cookie 与请求标识</text>
<rect x="480" y="180" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="480" y="180" width="320" height="170" rx="10" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-width="1.6"/>
<text x="640" y="215" text-anchor="middle" font-size="21" class="title">安全与路由入口</text>
<text x="640" y="249" text-anchor="middle" font-size="15" class="muted">security / router / dependencies</text>
<text x="640" y="278" text-anchor="middle" font-size="15" class="">来源、格式、身份和能力</text>
<rect x="920" y="180" width="320" height="170" rx="10" fill="#0f172a"/>
<rect x="920" y="180" width="320" height="170" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6"/>
<text x="1080" y="215" text-anchor="middle" font-size="21" class="title">所属业务服务</text>
<text x="1080" y="249" text-anchor="middle" font-size="15" class="muted">agents / conversations / 其他模块</text>
<text x="1080" y="278" text-anchor="middle" font-size="15" class="">资源规则、事务与普通结果</text>
<rect x="40" y="560" width="320" height="170" rx="10" fill="#0f172a"/>
